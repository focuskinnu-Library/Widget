name: Test

# Runs every suite against a real Chromium on every push and pull request.
#
# The suites rotted once before, silently, because nothing was running them.
# This is the thing that stops that happening again: audit.mjs exits non-zero
# the moment a check fails, so a red tick is the first thing anyone sees.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and its Chromium
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # audit-browser.mjs picks the downloaded browser on its own: the path it
      # prefers only exists in the sandbox the suites were written in.
      - name: Run every suite
        run: node audit.mjs
