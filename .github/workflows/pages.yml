name: Pages

# Publishes index.html to GitHub Pages, so Margin has a real URL you can open
# on your phone. It matters for more than convenience: a page served from your
# own origin can reach the dictionary API, which sandboxed previews cannot.
#
# One-time setup: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
