name: Revoot Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['revoot-android/**', '.github/workflows/revoot-android.yml']
    tags: ['revoot-v*']
  pull_request:
    paths: ['revoot-android/**', '.github/workflows/revoot-android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revoot-android
    env:
      # Play needs a strictly increasing versionCode; offset keeps room for manual builds.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        id: key
        env:
          KS_B64: ${{ secrets.REVOOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No REVOOT_KEYSTORE_BASE64 secret — building a debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release (AAB for Play + APK for sideloading)
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.REVOOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REVOOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REVOOT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Print signing fingerprint (goes in assetlinks.json)
        if: steps.key.outputs.signed == 'true'
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: revoot-android-${{ github.run_number }}
          path: |
            revoot-android/app/build/outputs/bundle/release/*.aab
            revoot-android/app/build/outputs/apk/release/*.apk
            revoot-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
