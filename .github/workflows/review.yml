name: Review

# Reads the diff on every pull request and leaves review notes.
# Needs the ANTHROPIC_API_KEY repository secret.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --stat "$BASE" "$HEAD" > /tmp/stat.txt
          git diff "$BASE" "$HEAD" > /tmp/diff.txt
          echo "Changed files:"; cat /tmp/stat.txt

      - name: Claude Code Base Action
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*)"
            --max-turns 15
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            The diff is at /tmp/diff.txt and a summary at /tmp/stat.txt. Read those
            first, then read the full files around anything that looks off — a diff
            alone hides most real bugs.

            This repo is Margin: a single-file, offline reading widget. index.html
            holds the markup, stylesheet and logic together, and state lives in
            localStorage under margin.v1. Weigh that shape when you review.

            Look hardest for:
              - Logic that breaks on empty, missing or malformed stored state
              - Spaced-repetition maths that could strand a word (never due again,
                or due forever)
              - User text interpolated into HTML without escaping
              - CSS that only resolves in one theme, or selectors that silently
                cancel each other out
              - Anything that would throw with no network, since the dictionary
                lookup is the one online call and must degrade quietly

            Report only what you can point at at a specific line and explain the
            failure for. Say so plainly when the diff is clean — do not pad the
            review. Skip style opinions the code already answers consistently.

            Post the review as a single PR comment with:
              gh pr comment ${{ github.event.pull_request.number }} --body "..."
            End the body with a horizontal rule and the italic line:
            _Generated by [Claude Code](https://claude.ai/code)_
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
