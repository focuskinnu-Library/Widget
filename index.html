<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Keep the words, the page, the lines and the pictures in your head — and give every book its own vibe.">
<meta name="theme-color" content="#f7f8fa">
<title>Margin — a reading companion</title>
<style>
/* ── base: neutrals per mode, hue per vibe ─────────────────────── */
:root{
  --base:#f6f7f9; --base-2:#ffffff;
  --ink:#12141a; --ink-2:#565d70; --ink-3:#8b92a6;
  --line:rgba(18,20,26,.10); --line-2:rgba(18,20,26,.06);
  --on-accent:#fff; --lift:0 1px 2px rgba(18,20,26,.05),0 10px 30px -18px rgba(18,20,26,.35);
  --accent:var(--a-l); --accent-2:var(--a2-l);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r:16px; --r-s:11px;
  --a-l:#5b6cff; --a-d:#93a0ff; --a2-l:#9b7bff; --a2-d:#b9a3ff;
}
[data-vibe=dusk] {--a-l:#a855f7;--a-d:#cb92ff;--a2-l:#f472b6;--a2-d:#f9a5cf}
[data-vibe=ember]{--a-l:#ed6b32;--a-d:#ff9c62;--a2-l:#f5a524;--a2-d:#ffc464}
[data-vibe=fern] {--a-l:#1f9d63;--a-d:#5fd39a;--a2-l:#84cc4f;--a2-d:#a8e07c}
[data-vibe=tide] {--a-l:#0e9ec2;--a-d:#4fd0e8;--a2-l:#5ad1c4;--a2-d:#88e5da}
[data-vibe=blush]{--a-l:#e8407f;--a-d:#ff8ab5;--a2-l:#ff8a5c;--a2-d:#ffb08c}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --base:#0d0f13; --base-2:#171a20;
    --ink:#eef0f5; --ink-2:#a2a9ba; --ink-3:#6e7589;
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.06);
    --on-accent:#0d0f13; --lift:0 1px 2px rgba(0,0,0,.4);
    --accent:var(--a-d); --accent-2:var(--a2-d);
  }
}
:root[data-theme=dark]{
  --base:#0d0f13; --base-2:#171a20;
  --ink:#eef0f5; --ink-2:#a2a9ba; --ink-3:#6e7589;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.06);
  --on-accent:#0d0f13; --lift:0 1px 2px rgba(0,0,0,.4);
  --accent:var(--a-d); --accent-2:var(--a2-d);
}
/* tinted surfaces derive from the vibe; plain fallback first */
:root{
  --bg:var(--base); --bg:color-mix(in srgb,var(--accent) 3.5%,var(--base));
  --surface:var(--base-2); --surface:color-mix(in srgb,var(--accent) 3%,var(--base-2));
  --soft:var(--base-2); --soft:color-mix(in srgb,var(--accent) 13%,var(--base-2));
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:0 0 96px; min-height:100vh; transition:background .5s;
}
#app{max-width:560px;margin:0 auto;padding:0 18px}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea{
  width:100%;background:var(--base-2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px 14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{resize:vertical;min-height:82px;line-height:1.55}
::placeholder{color:var(--ink-3)}

/* ── type ─────────────────────────────────────────────────────── */
.label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.serif{font-family:var(--serif)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.12;text-wrap:balance}
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.muted{color:var(--ink-2);font-size:14.5px}
.dim{font-family:var(--mono);color:var(--ink-3);font-size:11px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── chrome ───────────────────────────────────────────────────── */
header{padding:24px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.03em}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--accent)}
.back{font-family:var(--mono);display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;padding:6px 0}
.back:hover{color:var(--accent)}

nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line-2);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom));z-index:40;
}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:10px 4px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:color .15s,background .15s}
.tab.on{color:var(--on-accent);background:var(--accent)}
.pip{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:800;line-height:17px}
.tab.on .pip{background:var(--on-accent);color:var(--accent)}

/* ── surfaces ─────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-align:left;width:100%;display:block;position:relative;overflow:hidden;transition:transform .14s,border-color .14s}
button.row:hover{transform:translateY(-2px);border-color:var(--accent)}
.row .spine{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.entry{padding:16px 0;border-bottom:1px solid var(--line-2)}
.entry:last-child{border-bottom:0}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.btn{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:999px;padding:13px 20px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--accent);filter:none}
.btn.wide{width:100%}
.link{color:var(--accent);font-size:13px;font-weight:700}
.link:hover{text-decoration:underline}
.del{font-family:var(--mono);color:var(--ink-3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
.del:hover{color:var(--accent);background:var(--soft)}

.bar{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.chip.flat{background:var(--line-2);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}

/* ── pieces ───────────────────────────────────────────────────── */
.hero{border-radius:var(--r);padding:20px 18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);position:relative;overflow:hidden}
.hero h1{color:inherit}
.hero .sub{opacity:.82;font-size:14.5px;margin-top:4px}
.hero .bar{background:rgba(255,255,255,.28)}
.hero .bar i{background:var(--on-accent)}
.hero .dim{color:inherit;opacity:.78}

.quote{font-family:var(--serif);font-size:17.5px;line-height:1.58;padding-left:15px;border-left:3px solid var(--accent);border-radius:2px}
.word{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.pron{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:7px}
.say{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:7px;border-radius:50%;
  background:var(--soft);color:var(--accent);font-size:9px;vertical-align:middle;flex:none;transition:transform .1s}
.say:hover{transform:scale(1.12)}
.say:active{transform:scale(.92)}
.mine{background:var(--soft);border-radius:var(--r-s);padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.5}
.mine .label{color:var(--accent);display:block;margin-bottom:3px}

.seg{display:flex;gap:5px;margin:20px 0 14px}
.seg button{flex:1;padding:9px 4px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.seg button.on{color:var(--on-accent);background:var(--accent);border-color:transparent}
.empty{text-align:center;padding:44px 18px;color:var(--ink-3)}
.empty p{font-family:var(--serif);font-size:16.5px;line-height:1.6;max-width:290px;margin:0 auto;text-wrap:balance}
.nudge{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:var(--r);padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;margin-bottom:14px}
.nudge:hover{filter:brightness(1.06)}

/* vibe picker */
.vibes{display:flex;gap:8px;flex-wrap:wrap}
.vibe{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px;border-radius:var(--r-s);border:1px solid transparent;min-width:56px}
.vibe i{width:26px;height:26px;border-radius:50%;display:block}
.vibe span{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.vibe.on{border-color:var(--accent);background:var(--soft)}
.vibe.on span{color:var(--accent)}

/* dictionary lookup panel */
.lk{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.lk-head{padding:9px 12px;background:var(--soft);display:flex;align-items:baseline;gap:8px}
.sense{display:block;width:100%;text-align:left;padding:11px 12px;border-top:1px solid var(--line-2);transition:background .12s}
.sense:hover{background:var(--soft)}
.sense .pos{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.sense p{font-size:14px;line-height:1.45;margin-top:3px}
.sense em{display:block;font-family:var(--serif);font-size:13px;color:var(--ink-3);margin-top:4px}
.syn{padding:9px 12px;border-top:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:5px}

/* ── sheet ────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(6,8,12,.55);z-index:50;animation:fade .18s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--base-2);
  border-radius:22px 22px 0 0;max-width:560px;margin:0 auto;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1);
}
.grab{width:36px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 16px}
.field{margin-bottom:14px}
.field .label{display:block;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

/* ── review ───────────────────────────────────────────────────── */
.flash{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--lift);
  padding:34px 24px;min-height:250px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;cursor:pointer;
}
.flash .w{font-family:var(--serif);font-size:33px;font-weight:600;letter-spacing:-.02em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate button{padding:13px 6px;border-radius:var(--r-s);border:1px solid var(--line);font-size:13.5px;font-weight:700;background:var(--surface)}
.rate button:hover{border-color:var(--accent)}
.rate b{font-family:var(--mono);display:block;font-size:9.5px;font-weight:400;color:var(--ink-3);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--base);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;animation:fade .2s;white-space:nowrap}
.fade{animation:fade .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <div class="nav-in">
    <button class="tab" data-go="shelf">Shelf</button>
    <button class="tab" data-go="dict">Dictionary</button>
    <button class="tab" data-go="review">Review</button>
  </div>
</nav>

<script>
'use strict';
/* ---------------------------------------------------------------
   Margin — a reading companion.
   Everything lives on this device. No account, no server, no eyes.
----------------------------------------------------------------*/

const KEY = 'margin.v1';
const DAY = 864e5;
// Two dictionaries, tried in order. The first is richer — pronunciation and
// synonyms — but it is a small volunteer service that goes down. Wiktionary
// runs on Wikimedia infrastructure and is the safety net.
const SOURCES = [
  {name:'Free Dictionary',
   url: w => 'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w),
   parse: parseFreeDictionary},
  {name:'Wiktionary',
   url: w => 'https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(w),
   parse: parseWiktionary}
];

const VIBES = [
  {id:'paper', name:'Paper', a:'#5b6cff', b:'#9b7bff'},
  {id:'dusk',  name:'Dusk',  a:'#a855f7', b:'#f472b6'},
  {id:'ember', name:'Ember', a:'#ed6b32', b:'#f5a524'},
  {id:'fern',  name:'Fern',  a:'#1f9d63', b:'#84cc4f'},
  {id:'tide',  name:'Tide',  a:'#0e9ec2', b:'#5ad1c4'},
  {id:'blush', name:'Blush', a:'#e8407f', b:'#ff8a5c'}
];

let db = load();
let view = 'shelf';
let openBook = null;
let bookTab = 'words';
let session = null;
let draft = null;          // vibe being previewed inside a sheet

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.books) return Object.assign({books:[],words:[],quotes:[],notes:[],theme:null,vibe:'paper'}, d);
  }catch(e){}
  return {books:[], words:[], quotes:[], notes:[], theme:null, vibe:'paper'};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl  = s => esc(s).replace(/\n/g,'<br>');
const book = id => db.books.find(b => b.id === id);
const $ = s => document.querySelector(s);

function when(ts){
  const d = Math.floor((Date.now() - ts) / DAY);
  if(d <= 0) return 'today';
  if(d === 1) return 'yesterday';
  if(d < 30) return d + ' days ago';
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .3s'; }, 1500);
  setTimeout(() => t.remove(), 1850);
}

/* ---------------- the vibe -------------------------------------
   Each book carries a palette. Open the book and the whole app —
   dictionary included — takes it on, so the mood of what you're
   reading follows you around.
-----------------------------------------------------------------*/
function applyVibe(){
  const b = openBook && book(openBook);
  const v = draft || (b ? b.vibe : db.vibe) || 'paper';
  document.documentElement.dataset.vibe = v;
}

/* ---------------- spaced repetition (SM-2) --------------------- */
function freshCard(){ return {ease:2.5, reps:0, interval:0, due:Date.now()}; }

function grade(w, q){                       // q: 0 again · 4 good · 5 easy
  const c = w.srs || (w.srs = freshCard());
  if(q < 3){
    c.reps = 0; c.interval = 0;
    c.due = Date.now() + 6e5;               // back in ~10 minutes
  }else{
    c.reps++;
    c.interval = c.reps === 1 ? 1 : c.reps === 2 ? 6 : Math.round(c.interval * c.ease);
    c.ease = Math.max(1.3, c.ease + (0.1 - (5-q) * (0.08 + (5-q) * 0.02)));
    c.due = Date.now() + c.interval * DAY;
  }
  save();
}
const dueWords = () => db.words.filter(w => (w.srs?.due ?? 0) <= Date.now());

/* ---------------- the dictionary -------------------------------
   Pronunciation, senses, examples, synonyms. Tap a sense to keep
   it — then write what it means to you underneath. Both are saved;
   yours is the one the flashcard shows first.
-----------------------------------------------------------------*/
const fail = (code, msg) => Object.assign(new Error(msg), {code});

// Wiktionary returns definitions as HTML. DOMParser builds an inert document —
// no scripts run, no images fetch — so this is safe on untrusted markup.
function stripTags(html){
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
}

function parseFreeDictionary(json){
  const d = json[0];
  const senses = [];
  (d.meanings || []).forEach(m =>
    (m.definitions || []).slice(0,2).forEach(def =>
      senses.push({pos:m.partOfSpeech || '', def:def.definition, ex:def.example || ''})));
  return {
    phonetic: d.phonetic || (d.phonetics || []).find(p => p.text)?.text || '',
    audio: (d.phonetics || []).find(p => p.audio)?.audio || '',
    senses: senses.slice(0,5),
    syn: [...new Set((d.meanings || []).flatMap(m => m.synonyms || []))].slice(0,6)
  };
}

function parseWiktionary(json){
  const senses = [];
  (json.en || []).forEach(sec =>
    (sec.definitions || []).slice(0,3).forEach(def => {
      const text = stripTags(def.definition);
      if(!text) return;
      senses.push({
        pos: (sec.partOfSpeech || '').toLowerCase(),
        def: text,
        ex: stripTags((def.parsedExamples || [])[0]?.example || (def.examples || [])[0] || '')
      });
    }));
  return {phonetic:'', audio:'', senses:senses.slice(0,5), syn:[]};   // neither is offered here
}

async function lookup(term){
  const w = term.trim().toLowerCase();
  let sawReachable = false;

  for(const src of SOURCES){
    let r;
    try{
      r = await fetch(src.url(w));
    }catch(e){
      continue;                       // never left the page — try the next one
    }
    sawReachable = true;
    if(r.status === 404) continue;    // this dictionary doesn't have it
    if(!r.ok) continue;
    try{
      const parsed = src.parse(await r.json());
      if(parsed.senses.length) return Object.assign(parsed, {source:src.name});
    }catch(e){ /* unreadable response — fall through to the next source */ }
  }

  // Only call it "not a word" if a dictionary actually answered and said so.
  // If nothing was reachable, that is a network problem, not a vocabulary one.
  throw sawReachable
    ? fail('none', 'no entry for that word')
    : fail('unreachable', 'could not reach any dictionary');
}

async function doLookup(){
  const term = ($('#w')?.value || '').trim();
  const box = $('#lk');
  if(!term || !box) return;
  box.innerHTML = `<div class="lk-head"><span class="label">Looking up ${esc(term)}…</span></div>`;
  try{
    const r = await lookup(term);
    window.__senses = r.senses;
    box.innerHTML =
      `<div class="lk-head"><span class="word" style="font-size:16px">${esc(term)}</span>
        ${r.phonetic ? `<span class="pron">${esc(r.phonetic)}</span>` : ''}${sayBtn(term, r.audio)}
        <span class="label" style="margin-left:auto">${esc(r.source)} · tap to keep</span></div>` +
      (r.senses.length ? r.senses.map((s,i) => `<button type="button" class="sense" onclick="useSense(${i})">
          ${s.pos ? `<span class="pos">${esc(s.pos)}</span>` : ''}
          <p>${esc(s.def)}</p>${s.ex ? `<em>"${esc(s.ex)}"</em>` : ''}
        </button>`).join('')
        : `<div class="sense"><p>No definition came back.</p></div>`) +
      (r.syn.length ? `<div class="syn">${r.syn.map(s => `<span class="chip flat">${esc(s)}</span>`).join('')}</div>` : '');
    const ph = $('#ph'); if(ph) ph.value = r.phonetic || '';
    const au = $('#au'); if(au) au.value = r.audio || '';
  }catch(e){
    const web = `https://www.google.com/search?q=${encodeURIComponent('define ' + term)}`;
    box.innerHTML = `<div class="lk-head" style="display:block">
      <span class="label">${e.code === 'none'
        ? `No entry for “${esc(term)}”`
        : 'Couldn’t reach any dictionary'}</span>
      <div style="font-size:13.5px;line-height:1.5;margin-top:5px;color:var(--ink-2)">
        ${e.code === 'none'
          ? 'Neither dictionary has it. It may be a name, a plural, or too new. Try the singular, or just write the meaning yourself.'
          : 'You’re offline, or this page is blocking outside requests. Open Margin from your own link and lookup works.'}
      </div>
      <a class="link" href="${web}" target="_blank" rel="noopener"
         style="display:inline-block;margin-top:8px">Search the web for “${esc(term)}” ↗</a>
    </div>`;
  }
}
function useSense(i){
  const s = (window.__senses || [])[i];
  if(!s) return;
  $('#m').value = (s.pos ? s.pos + ' — ' : '') + s.def;
  if(s.ex && !$('#c').value.trim()) $('#c').value = s.ex;
  toast('Kept — now put it in your words');
  $('#mine')?.focus();
}

/* ---------------- saying it out loud ---------------------------
   A real recording when the dictionary has one. Otherwise the voice
   built into the browser, which needs no network and so still works
   offline, or on a page that blocks outside requests.
-----------------------------------------------------------------*/
function say(word, url){
  if(!word) return;
  if(url){
    const a = new Audio(url);
    a.play().then(() => {}).catch(() => speak(word));   // dead link, or blocked
    return;
  }
  speak(word);
}
function speak(word){
  if(!('speechSynthesis' in window)) return toast('No voice on this device');
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-GB'; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
const sayBtn = (w, a) =>
  `<button class="say" data-say="${esc(w)}" data-audio="${esc(a || '')}" title="Hear it" aria-label="Pronounce ${esc(w)}">▸</button>`;

/* ---------------- render --------------------------------------- */

const blank = t => `<div class="empty"><p>${t}</p></div>`;

/* --- personal dictionary --- */
function dictView(){
  const q = (window.__q || '').toLowerCase();
  const all = db.words
    .filter(w => !q || w.word.toLowerCase().includes(q) ||
                 (w.meaning||'').toLowerCase().includes(q) || (w.mine||'').toLowerCase().includes(q))
    .sort((a,b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()));

  let out = '', letter = '';
  all.forEach(w => {
    const L = w.word[0].toUpperCase();
    if(L !== letter){ letter = L; out += `<div class="label grad" style="margin:20px 0 2px;font-size:12px">${esc(letter)}</div>`; }
    const b = book(w.bookId);
    const days = w.srs ? Math.ceil((w.srs.due - Date.now()) / DAY) : 0;
    out += `<div class="entry">
      <div class="between"><span><span class="word">${esc(w.word)}</span>${w.phonetic?`<span class="pron">${esc(w.phonetic)}</span>`:''}${sayBtn(w.word, w.audio)}</span>
        <span class="chip">${days <= 0 ? 'due now' : 'in ' + days + 'd'}</span></div>
      ${w.mine ? `<div class="mine"><span class="label">In your words</span>${nl(w.mine)}</div>`
               : `<div class="muted" style="margin-top:5px">${nl(w.meaning)}</div>`}
      <div class="dim" style="margin-top:8px">${b ? esc(b.title) + (w.page ? ' · p.' + w.page : '') : ''}</div>
    </div>`;
  });

  return topBar(`${db.words.length} ${db.words.length===1?'word':'words'} collected`) + `
  <h1 style="margin-bottom:5px">Your <span class="grad">dictionary</span></h1>
  <div class="muted" style="margin-bottom:16px">Every word still carrying the page you met it on.</div>
  ${db.words.length ? `<input placeholder="Search your words…" value="${esc(window.__q||'')}"
      oninput="window.__q=this.value;dictList()">
    <div id="dl">${out || blank('Nothing matches that.')}</div>`
  : blank('Words you save inside a book gather here — your own dictionary, in your own words.')}`;
}
function dictList(){
  const el = $('#dl'); if(!el) return;
  const y = window.scrollY;
  const tmp = document.createElement('div'); tmp.innerHTML = dictView();
  el.innerHTML = tmp.querySelector('#dl').innerHTML;
  window.scrollTo(0, y);
}

/* --- review --- */
function reviewView(){
  if(!session || !session.queue.length){
    const due = dueWords();
    if(!db.words.length) return topBar('Nothing to review yet') + blank('Save a few words first — then they\'ll come back to find you.');
    if(session && session.done){
      const s = session; session = null;
      return topBar('Done for now') + `<div class="empty" style="padding-top:60px">
        <div style="font-size:40px" class="grad">✓</div>
        <p style="margin-top:10px">${s.done} ${s.done===1?'word':'words'} reviewed. They'll come back when you're just about to forget them.</p>
        <button class="btn ghost" style="margin-top:22px" data-go="shelf">Back to shelf</button></div>`;
    }
    if(!due.length){
      const next = Math.min(...db.words.map(w => w.srs?.due ?? Infinity));
      const d = Math.max(1, Math.ceil((next - Date.now()) / DAY));
      return topBar('All caught up') + `<div class="empty" style="padding-top:60px">
        <p>Nothing due. Your words are still settling — the next batch surfaces in about ${d} day${d>1?'s':''}.</p>
        <button class="btn ghost" style="margin-top:22px" onclick="cram()">Practise anyway</button></div>`;
    }
    session = {queue: shuffle(due.slice()), flip:false, done:0, total:due.length};
  }

  const w = session.queue[0], b = book(w.bookId);
  const n = session.total - session.queue.length + 1;

  return topBar(`${n} of ${session.total}`) + `
  <div class="between" style="margin-bottom:12px">
    <span class="chip">${b ? esc(b.title) : 'Review'}</span>
    <span class="dim">${w.page ? 'p.' + w.page : ''}</span>
  </div>
  <div class="flash" onclick="flip()">
    ${session.flip ? `
      <div class="w" style="font-size:23px">${esc(w.word)}${w.phonetic?`<span class="pron">${esc(w.phonetic)}</span>`:''}${sayBtn(w.word, w.audio)}</div>
      ${w.mine ? `<div style="margin-top:14px;font-size:16.5px;line-height:1.55;max-width:350px">${nl(w.mine)}</div>
                  <div class="label" style="margin-top:14px">What the dictionary says</div>` : ''}
      <div style="margin-top:${w.mine?6:14}px;font-size:${w.mine?14:15.5}px;line-height:1.55;color:var(--ink-2);max-width:350px">${nl(w.meaning)}</div>
      ${w.context ? `<div class="serif" style="margin-top:14px;font-style:italic;color:var(--ink-3);font-size:14px;max-width:350px">"${nl(w.context)}"</div>` : ''}`
    : `<div class="w">${esc(w.word)}${sayBtn(w.word, w.audio)}</div>
       <div class="dim" style="margin-top:16px">Tap to reveal</div>`}
  </div>
  ${session.flip ? `<div class="rate">
      <button onclick="answer(0)">Again<b>&lt; 10 min</b></button>
      <button onclick="answer(4)">Good<b>${nextIn(w,4)}</b></button>
      <button onclick="answer(5)" style="color:var(--accent)">Easy<b>${nextIn(w,5)}</b></button>
    </div>` : `<div class="dim" style="text-align:center;margin-top:16px">Say it out loud before you flip.</div>`}`;
}
function nextIn(w, q){
  const c = w.srs || freshCard();
  const r = c.reps + 1;
  const i = r === 1 ? 1 : r === 2 ? 6 : Math.round(c.interval * c.ease * (q === 5 ? 1.3 : 1));
  return i === 1 ? 'tomorrow' : i < 31 ? i + ' days' : Math.round(i/30) + ' months';
}
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(v => v[1]);
function flip(){ if(session){ session.flip = true; render(); } }
function answer(q){
  const w = session.queue.shift();
  grade(w, q);
  if(q < 3) session.queue.push(w); else session.done++;
  session.flip = false;
  render();
}
function cram(){ session = {queue: shuffle(db.words.slice(0,20)), flip:false, done:0, total:Math.min(20, db.words.length)}; render(); }

/* ---------------- sheets --------------------------------------- */
function sheet(title, html, onSave, saveLabel){
  closeSheet();
  const s = document.createElement('div');
  s.innerHTML = `<div class="scrim" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div>
      <h2 style="margin-bottom:16px;font-size:20px">${title}</h2>${html}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" style="flex:1" onclick="closeSheet()">Cancel</button>
        <button class="btn" style="flex:2" id="ok">${saveLabel || 'Save'}</button>
      </div></div>`;
  s.id = 'sh'; document.body.appendChild(s);
  $('#ok').onclick = () => { if(onSave() !== false){ closeSheet(); render(); } };
  setTimeout(() => s.querySelector('input,textarea')?.focus(), 90);
}
function closeSheet(){ document.getElementById('sh')?.remove(); draft = null; applyVibe(); }
const val = id => ($('#'+id)?.value || '').trim();

function vibePicker(sel){
  return `<div class="vibes" id="vp">${VIBES.map(v => `
    <button type="button" class="vibe ${v.id===sel?'on':''}" onclick="pickVibe('${v.id}')">
      <i style="background:linear-gradient(135deg,${v.a},${v.b})"></i><span>${v.name}</span>
    </button>`).join('')}</div>`;
}
function pickVibe(id){
  draft = id;

/* ---------------- actions -------------------------------------- */
function setTab(t){ bookTab = t; render(); }
function drop(kind, id){
  if(!confirm('Remove this? It won\'t come back.')) return;
  db[kind] = db[kind].filter(x => x.id !== id); save(); render();
}
function dropBook(id){
  const b = book(id);
  if(!confirm(`Delete "${b.title}" and everything saved inside it?`)) return;
  db.books = db.books.filter(x => x.id !== id);
  ['words','quotes','notes'].forEach(k => db[k] = db[k].filter(x => x.bookId !== id));
  save(); view = 'shelf'; openBook = null; render();
}
function toggleTheme(){
  const dark = document.documentElement.dataset.theme === 'dark';
  db.theme = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = db.theme;
  save(); render();
}
function go(v){ view = v; session = null; if(v !== 'book') openBook = null; render(); }

// Capture phase: the flashcard carries its own inline click handler, and a
// bubbling listener here would fire after it — pressing play would also flip
// the card. Catching it on the way down stops that.
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]');
  if(!s) return;
  e.stopPropagation(); e.preventDefault();
  say(s.dataset.say, s.dataset.audio);
}, true);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-book]');
  if(!t) return;
  if(t.dataset.book){
    openBook = t.dataset.book; bookTab = 'words'; view = 'book';
    db.vibe = book(openBook).vibe || 'paper'; save(); render();
  }else go(t.dataset.go);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSheet();
  if(view === 'review' && session?.queue.length && !document.getElementById('sh')){
    if(e.key === ' '){ e.preventDefault(); flip(); }
    if(session.flip && '123'.includes(e.key)) answer([0,4,5][+e.key-1]);
  }
});

if(db.theme) document.documentElement.dataset.theme = db.theme;
render();
</script>
</body>
</html>
