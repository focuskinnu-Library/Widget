function memoryCard(){
  if(!db.words.length&&!db.quotes.length&&!db.notes.length) return '';
  const items=db.words.map(w=>({at:w.at,bookId:w.bookId,kind:'a word',text:w.word}))
    .concat(db.quotes.map(q=>({at:q.at,bookId:q.bookId,kind:'a line',text:q.text})))
    .concat(db.notes.map(n=>({at:n.at,bookId:n.bookId,kind:'a note',text:n.text})));
  for(const ago of [30,90,180,365]){
    const target=Date.now()-ago*DAY;
    const hit=items.filter(m=>Math.abs(m.at-target)<DAY).sort((a,b)=>b.at-a.at)[0];
    if(!hit) continue;
    const b=book(hit.bookId);
    const snip=hit.text.length>90?hit.text.slice(0,89)+'…':hit.text;
    return `<div class="card daycard margin-note" role="button" tabindex="0" data-book="${hit.bookId}">
      <div class="lbl">${ago} days ago you kept ${hit.kind}</div>
      ${hit.kind==='a word'
        ?`<div class="big" style="margin-top:6px">${esc(hit.text)}</div>`
        :`<p class="serif" style="font-size:15.5px;font-style:italic;line-height:1.55;margin-top:7px;
            overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(snip)}</p>`}
      ${b?`<div class="dim" style="margin-top:7px">${esc(b.title)}</div>`:''}
    </button>`;
  }
  return '';
}
/* A quiet word about backups: shown only when the shelf has grown and
   the last copy is old enough to hurt to lose. */
function backupNudge(){
  const items=db.words.length+db.quotes.length+db.notes.length+db.books.length;
  const last=db.prefs.lastBackupAt||0, snoozed=db.prefs.backupSnoozeAt||0;
  if(items<12||Date.now()-last<12*DAY||Date.now()-snoozed<14*DAY) return '';
  return `<div class="card"><div class="row">
    <div><h3>Keep a copy of this</h3>
    <p class="muted" style="font-size:13.5px;margin-top:2px">${items} things live only on this device.</p></div>
    <button class="btn sm" style="flex:none" onclick="exportBackup()">Backup</button>
    <button class="btn ghost sm" style="flex:none" onclick="snoozeBackup()">Later</button></div></div>`;
}
function snoozeBackup(){db.prefs.backupSnoozeAt=Date.now();save();render();}

/* ══ notifications ════════════════════════════════════════════════
   Local only: the browser reminds you when words are going stale.
   No server, so nothing arrives while the app is closed.
------------------------------------------------------------------*/
async function askNotify(){
  if(!('Notification' in window)) return toast('This browser has no notifications');
  const p=await Notification.requestPermission();
  db.prefs.notify=(p==='granted'); save(); render();
  toast(p==='granted'?'Reminders on':'Reminders stay off');
}
function maybeNotify(){
  if(!db.prefs.notify||!('Notification' in window)||Notification.permission!=='granted') return;
  const n=due().length; if(!n) return;
  const last=db.prefs.notifiedAt||0;
  if(Date.now()-last<12*36e5) return;
  try{
    new Notification(`${n} word${n>1?'s':''} going stale`,
      {body:'A minute of practice and they stay yours.',tag:'lingobox-due'});
    db.prefs.notifiedAt=Date.now(); save();
  }catch(e){}
}

/* ══ export / import ══════════════════════════════════════════════*/
const stamp=()=>new Date().toISOString().slice(0,10);
async function offer(filename,text,mime){
  if(window.claude?.downloads?.save){
    try{await window.claude.downloads.save({filename,data:text});toast('Saved')}
    catch(e){if(e&&e.code!=='declined')toast('Could not save here')}
    return;
  }
  const url=URL.createObjectURL(new Blob([text],{type:mime}));
  const a=Object.assign(document.createElement('a'),{href:url,download:filename});
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Downloaded');
}
const exportBackup=()=>{db.prefs.lastBackupAt=Date.now();save();
  offer(`lingobox-backup-${stamp()}.json`,JSON.stringify(db,null,2),'application/json')};
function exportMarkdown(){
  const L=[`# LingoBox — ${stamp()}`,''];
  db.books.forEach(b=>{
    L.push(`## ${b.title}`,`*${b.author||'—'}* · ${genreOf(b.genre).name} · page ${b.page||0}${b.pages?' of '+b.pages:''}`,'');
    const of=k=>db[k].filter(x=>x.bookId===b.id);
    const ws=of('words');
    if(ws.length){L.push('### Words','');ws.forEach(w=>{
      L.push(`**${w.word}**${w.phonetic?' '+w.phonetic:''}${w.page?` · p.${w.page}`:''}`);
      if(w.meaning&&w.meaning!=='—')L.push(`- ${w.meaning}`);
      if(w.mine)L.push(`- *In my words:* ${w.mine}`);
      if(w.context)L.push(`- Found in: "${w.context}"`); L.push('');});}
    const qs=of('quotes');
    if(qs.length){L.push('### Quotes','');qs.forEach(q=>L.push('> '+q.text.replace(/\n/g,'\n> '),q.page?`— p.${q.page}`:'',''));}
    const ns=of('notes');
    if(ns.length){L.push('### Journal','');ns.forEach(n=>L.push(`**${new Date(n.at).toLocaleDateString()}**${n.page?` · p.${n.page}`:''}`,'',n.text,''));}
  });
  offer(`lingobox-${stamp()}.md`,L.join('\n'),'text/markdown');
}
function exportAnki(){
  const q=t=>'"'+String(t==null?'':t).replace(/"/g,'""')+'"';
  const rows=db.words.map(w=>{const b=book(w.bookId);
    const back=[w.mine,(w.meaning&&w.meaning!=='—')?w.meaning:'',b?b.title+(w.page?' · p.'+w.page:''):''].filter(Boolean).join('<br><br>');
    return q(w.word)+','+q(back);});
  if(!rows.length) return toast('No words to export yet');
  offer(`lingobox-anki-${stamp()}.txt`,rows.join('\n'),'text/plain');
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch(e){return toast('That is not a LingoBox backup')}
    if(!d||!Array.isArray(d.books)) return toast('That is not a LingoBox backup');
    let n=0;
    ['books','words','quotes','notes'].forEach(k=>{
      const have=new Set((db[k]||[]).map(x=>x.id));
      (d[k]||[]).forEach(x=>{if(x&&x.id&&!have.has(x.id)){db[k].push(x);n++}});});
    if(d.profile&&!db.profile) db.profile=d.profile;
    save(); closeSheet(); render();
    toast(n?`${n} item${n>1?'s':''} restored`:'Already up to date');
  };
  r.readAsText(f);
}

  sess={kind,queue:shuffle(pool.slice(0,20)),i:0,done:0,flip:false,picked:null,total:Math.min(20,pool.length)};

}
function endSession(){const d=sess?sess.done:0; sess=null; render();

      :`<div class="w">${esc(w.word)}${sayBtn(w.word,w.audio)}</div>

    ${s.flip?`<div class="rate">

    :`<div class="folio" style="text-align:center;margin-top:14px;letter-spacing:.12em">SAY IT OUT LOUD BEFORE YOU FLIP</div>`}`;

  if(s.kind==='quiz'){
    if(!s.opts){
      const wrong=shuffle(db.words.filter(x=>x.id!==w.id)).slice(0,3);

function flip(){if(sess){sess.flip=true;render()}}
function answer(q){const w=sess.queue.shift(); grade(w,q);
  if(q<3) sess.queue.push(w); else sess.done++;
  sess.flip=false; render();}
function pick(id){if(sess.picked)return; sess.picked=id;
  const w=sess.queue[0]; grade(w,id===w.id?4:0);
  if(id===w.id) sess.done++; render();}
function checkSpell(){
  const w=sess.queue[0], v=($('#sp')?.value||'').trim().toLowerCase();
  if(!v) return toast('Have a go first');
  const ok=v===w.word.trim().toLowerCase();
  sess.picked=ok?'ok':'no'; grade(w,ok?4:0); if(ok) sess.done++; render();
}
function nextQ(){sess.queue.shift(); sess.opts=null; sess.picked=null; sess.heard=''; sess.micErr=''; render();}

/* ── chapter IV · the colophon ── */
function heatmapHtml(){
  const today=new Date(); today.setHours(12,0,0,0);
  const start=new Date(today); start.setDate(start.getDate()-(26*7-1)); start.setDate(start.getDate()-start.getDay());
  const cells=[]; let total=0, active=0;
  for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
    const row=db.log[dayKey(d)]; const v=row?((row.a||0)+(row.r||0)):0;
    total+=v; if(v) active++;
    const lvl=v===0?0:v<=2?1:v<=5?2:3;
    cells.push(`<i class="${lvl?'l'+lvl:''}" title="${dayKey(d)} — ${v||'quiet'}"></i>`);
  }
  return {grid:cells.join(''), total, active};
}
function recapData(){
  const rows=Object.values(db.log||{});
  const reviews=rows.reduce((s,r)=>s+(r.r||0),0);
  const kept=rows.reduce((s,r)=>s+(r.a||0),0);
  const firstWord=[...db.words].sort((a,b)=>a.at-b.at)[0];
  const longest=db.words.length?db.words.reduce((m,w)=>w.word.length>=m.word.length?w:m):null;
  const tally={}; db.books.forEach(b=>tally[b.genre]=(tally[b.genre]||0)+1);
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return {reviews,kept,firstWord,longest,topGenre:top?genreOf(top[0]):null,
    pages:db.books.reduce((s,b)=>s+(b.page||0),0)};
}
async function shareRecap(){
  const p=db.profile, r=recapData(), g=genreOf(db.prefs.lastGenre||'literary');
  const S=1080, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  const grad=x.createLinearGradient(0,0,S,S); grad.addColorStop(0,g.a); grad.addColorStop(1,g.b);
  x.fillStyle=grad; x.fillRect(0,0,S,S);
  x.fillStyle='rgba(255,255,255,.10)';
  for(let i=0;i<36;i++){x.beginPath();x.arc(Math.random()*S,Math.random()*S,6+Math.random()*24,0,6.3);x.fill()}
  x.fillStyle='#fff';
  x.font='600 58px Georgia, "Iowan Old Style", serif';
  x.fillText(`${p.name}'s shelf`,95,150);
  x.globalAlpha=.85; x.font='500 30px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText('in numbers · LingoBox',95,196);
  const tiles=[[db.words.length,'words kept'],[db.books.length,'books read'],
    [r.reviews,'reviews done'],[p.streak||1,'day streak'],
    [db.quotes.length,'lines kept'],[r.pages,'pages deep']];
  tiles.forEach(([v,l],i)=>{
    const col=i%2, row=Math.floor(i/2);
    const X=95+col*460, Y=320+row*180;
    x.globalAlpha=1; x.font='700 92px Georgia, "Iowan Old Style", serif'; x.fillText(String(v),X,Y);
    x.globalAlpha=.8; x.font='600 28px -apple-system, Helvetica, Arial, sans-serif';
    x.fillText(l.toUpperCase(),X,Y+44);
  });
  x.globalAlpha=.8; x.font='800 27px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText('LingoBox',95,S-70);
  c.toBlob(async blob=>{
    if(!blob) return toast('Could not make the image');
    const file=new File([blob],`lingobox-recap-${stamp()}.png`,{type:'image/png'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return} }
    catch(e){ if(e&&e.name==='AbortError') return; }
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{href:url,download:file.name});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Image saved');
  },'image/png');
}

      <div class="nm">${esc(p.name)}</div>
      <div class="orn2">⁂</div>
      <div class="acc">${db.books.length} VOLUME${db.books.length===1?'':'S'} · ${db.words.length} CARD${db.words.length===1?'':'S'} · ${days} DAY${days>1?'S':''}</div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="row"><div class="lbl">Colophon · your shelf in numbers</div>
        <button class="link" onclick="shareRecap()">Share the plate</button></div>
      <div class="recp">${(()=>{const r=recapData();
        return [[db.words.length,'words kept'],[db.books.length,'volumes'],
          [r.reviews,'reviews set'],[p.streak||1,'day streak'],
          [db.quotes.length,'lines kept'],[r.pages,'pages deep']]
        .map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');})()}</div>
      ${(()=>{const r=recapData(); const bits=[];
        if(r.firstWord) bits.push(`The first word you kept was <b class="serif">${esc(r.firstWord.word)}</b>.`);
        if(r.longest&&r.longest.word.length>3) bits.push(`Longest so far: <b class="serif">${esc(r.longest.word)}</b> (${r.longest.word.length} letters).`);
        if(r.topGenre) bits.push(`You read most in <b>${r.topGenre.name}</b>.`);
        return bits.length?`<p class="muted" style="font-size:13.5px;margin-top:12px;line-height:1.65;font-style:italic">${bits.join(' ')}</p>`:'';})()}
    </div>

    <div class="card" style="margin-top:12px">
      <div class="row"><div class="lbl">Reading weather · the pressman's calendar</div><span class="chip flat">26 wk</span></div>
      <div style="margin-top:13px">${(()=>{const h=heatmapHtml();return `<div class="hmwrap">
          <div class="hmside"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div>
          <div class="hm">${h.grid}</div></div>`;})()}</div>
      <div class="row" style="margin-top:13px">
        <span class="folio">${(()=>{const h=heatmapHtml();return `${h.active} reading days · ${h.total} set & reviewed`;})()}</span>
        <span class="folio" style="display:flex;align-items:center;gap:3px">quiet
          <i style="width:9px;height:9px;background:var(--line2);display:inline-block"></i><i style="width:9px;height:9px;background:color-mix(in srgb,var(--rosso) 28%,var(--surf2));display:inline-block"></i><i style="width:9px;height:9px;background:color-mix(in srgb,var(--rosso) 58%,var(--surf2));display:inline-block"></i><i style="width:9px;height:9px;background:var(--rosso);display:inline-block"></i>busy</span></div>
    </div>

    <div class="card" style="margin-top:12px"><div class="row"><div>
      <span class="lbl">Reminders</span>
      <div class="muted" style="font-size:13px;margin-top:4px">${db.prefs.notify?'On — nudges when your words go stale.':'Off. Only ever about your own words — never anything else.'}</div></div>
      <button class="btn ghost sm" style="flex:none" onclick="askNotify()">${db.prefs.notify?'Re-check':'Turn on'}</button></div></div>

    <div class="card" style="margin-top:12px"><div class="lbl">Your data</div>
      <p class="muted" style="font-size:13.5px;margin-top:8px">${n} thing${n===1?'':'s'} saved, all of it on this device.${
        db.prefs.persisted?' The browser has agreed to keep it rather than evict it when space runs short.':''}
      A backup is still the only copy that survives a cleared browser or a new phone.</p>
      <button class="btn wide" style="margin-top:13px" onclick="exportBackup()">Download a backup</button>
      <div class="two" style="margin-top:9px">
        <button class="btn ghost sm" onclick="exportMarkdown()">Markdown</button>
        <button class="btn ghost sm" onclick="exportAnki()">Anki deck</button></div>
      <div class="field" style="margin-top:16px"><span class="lbl">Restore from a backup</span>
        <input id="imp" type="file" accept=".json,application/json" onchange="importBackup(this)">
        <div class="folio" style="margin-top:6px">Adds anything missing. Nothing already here is changed.</div></div>
      <div class="field" style="margin-top:4px"><span class="lbl">Room left</span>
        <div class="folio" id="quota" style="line-height:1.6">Asking the browser…</div></div></div>

    <div class="card" style="margin-top:12px"><div class="row"><div>
      <span class="lbl">Name</span>
      <div class="serif" style="font-style:italic;font-size:15px;margin-top:4px">${esc(p.name)}</div></div>
      <button class="btn ghost sm" onclick="sheetName()">Change</button></div></div>

    <div style="text-align:center;margin:28px 0 6px">
      <div class="orna" style="font-size:17px">⁂</div>
      <p class="folio" style="margin-top:9px;letter-spacing:.14em">PRINTED ENTIRELY ON THIS DEVICE · LINGOBOX ${VER}<br>
        NO ACCOUNT · NO TRACKING · NOTHING SENT ANYWHERE</p></div>
  </div>`;
}
function quotaNote(){
  const el=document.getElementById('quota'); if(!el) return;
  if(!navigator.storage||!navigator.storage.estimate){el.textContent='This browser keeps its numbers to itself.';return}
  navigator.storage.estimate().then(e=>{
    if(!e.usage||!e.quota){el.textContent='';return}
    const pct=Math.round(e.usage/e.quota*100);
    el.innerHTML=`Using about ${(e.usage/1048576).toFixed(1)} MB of the ~${Math.max(1,Math.round(e.quota/1048576))} MB offered — ${
      pct<70?'plenty of room':'worth a backup soon'}.`;
  }).catch(()=>{el.textContent=''});
}


/* ══ sheets ═══════════════════════════════════════════════════════*/
function sheet(title,html,onSave,label){
  closeSheet();
  const s=document.createElement('div');
  s.innerHTML=`<div class="scrim" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div><h2 style="margin-bottom:16px">${title}</h2>${html}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" style="flex:1" onclick="closeSheet()">Cancel</button>
        <button class="btn" style="flex:2" id="ok">${label||'Save'}</button></div></div>`;
  s.id='sh'; document.body.appendChild(s);
  $('#ok').onclick=()=>{if(onSave()!==false){closeSheet();render()}};
  setTimeout(()=>s.querySelector('input,textarea')?.focus(),90);
}
function mark(b){b.marks=(b.marks||[]).concat([{page:b.page||0,at:Date.now()}]).slice(-12)}
function closeSheet(){document.getElementById('sh')?.remove(); draft=null; draftCover=''; applyWorld();}
const val=id=>($('#'+id)?.value||'').trim();

function genrePicker(sel){
  return `<div class="gens" id="gp">${GENRES.map(g=>`
    <button type="button" class="gen ${g.id===sel?'on':''}" onclick="pickGenre('${g.id}')">
      <i style="background:linear-gradient(135deg,${g.a},${g.b})"></i><span>${g.name}</span></button>`).join('')}</div>`;
}
function pickGenre(id){draft=id; applyWorld();
  const gp=$('#gp'); if(gp) gp.outerHTML=genrePicker(id);}

let draftCover='';
function sheetBook(){
  draft='literary'; draftCover='';
  sheet('Add a book',`
    <div class="field"><span class="lbl">Title</span>
      <div class="inline"><input id="t" placeholder="The Secret History" onkeydown="if(event.key==='Enter'){event.preventDefault();findBook()}">
      <button type="button" class="btn sm" onclick="findBook()">Find</button></div>
      <div id="fb"></div></div>
    <div class="field"><span class="lbl">Author</span><input id="a" placeholder="Donna Tartt"></div>
    <div class="two">
      <div class="field"><span class="lbl">On page</span><input id="p" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><span class="lbl">Total pages</span><input id="tp" type="number" inputmode="numeric" placeholder="optional"></div></div>
    <div class="field"><span class="lbl">What kind of book? The app dresses for it</span>${genrePicker('literary')}</div>`,
  ()=>{
    if(!val('t')) return toast('A title, at least'),false;
    const g=draft||'literary';
    db.books.unshift({id:uid(),title:val('t'),author:val('a'),page:+val('p')||0,pages:+val('tp')||0,
      genre:g,cover:draftCover||'',at:Date.now()});
    db.prefs.lastGenre=g; save();
  },'Add book');
}
function sheetGenre(){
  const b=book(openBook); draft=b.genre||'literary';
  sheet('The world of this book',
    `<p class="muted" style="margin-bottom:14px">Pick what it feels like. The colours and the weather behind the page both change — everywhere in the app, while you're in this book.</p>
     ${genrePicker(b.genre||'literary')}`,
  ()=>{b.genre=draft||'literary'; db.prefs.lastGenre=b.genre; save();},'Keep this world');
}
function sheetName(){
  sheet('Your name',`<div class="field"><span class="lbl">What should we call you?</span>
    <input id="nm2" value="${esc(db.profile.name)}" maxlength="40"></div>`,
  ()=>{const v=val('nm2'); if(!v) return toast('A name, or a nickname'),false; db.profile.name=v; save();});
}
function sheetPage(){
  const b=book(openBook);
  sheet('Move your bookmark',`<div class="two">
    <div class="field"><span class="lbl">Stopped at page</span><input id="p" type="number" inputmode="numeric" value="${b.page||''}"></div>
    <div class="field"><span class="lbl">Total pages</span><input id="tp" type="number" inputmode="numeric" value="${b.pages||''}"></div></div>`,
  ()=>{b.page=+val('p')||0; b.pages=+val('tp')||0; mark(b); save();});
}
function sheetEntry(){
  const b=book(openBook);
  const pg=`<div class="field"><span class="lbl">Page</span><input id="p" type="number" inputmode="numeric" value="${b.page||''}"></div>`;
  if(bookTab==='words'){
    sheet('A new word',`
      <div class="field"><span class="lbl">Word</span>
        <div class="inline"><input id="w" placeholder="susurrus" onkeydown="if(event.key==='Enter'){event.preventDefault();doLookup()}">
        <button type="button" class="btn sm" onclick="doLookup()">Look up</button></div>
        <input id="ph" type="hidden"><input id="au" type="hidden"><div id="lk"></div></div>
      <div class="field"><span class="lbl">What the dictionary says</span>
        <textarea id="m" placeholder="Look it up above, or type it here." style="min-height:64px"></textarea></div>
      <div class="field"><span class="lbl">In your own words — the one you'll remember</span>
        <textarea id="mine" placeholder="Like wind through paper. The sound the library makes." style="min-height:64px"></textarea></div>
      <div class="field"><span class="lbl">The sentence you found it in · optional</span>
        <textarea id="c" placeholder="A susurrus of leaves overhead…" style="min-height:54px"></textarea></div>${pg}`,
    ()=>{ 
      if(!val('w')) return toast('Type the word'),false;
      if(!val('m')&&!val('mine')) return toast('Give it a meaning — theirs or yours'),false;
      db.words.unshift({id:uid(),bookId:b.id,word:val('w'),phonetic:val('ph'),audio:val('au'),
        meaning:val('m')||'—',mine:val('mine'),context:val('c'),page:+val('p')||0,at:Date.now(),srs:fresh()});
      bumpLog('a'); save(); toast('Added to your dictionary');
    },'Keep this word');
  }else if(bookTab==='quotes'){
    sheet('A line worth keeping',`<div class="field"><span class="lbl">The line</span>
      <textarea id="q" placeholder="Beauty is terror. Whatever we call beautiful, we quiver before it."></textarea></div>${pg}`,
    ()=>{if(!val('q'))return toast('Nothing to keep yet'),false;
      db.quotes.unshift({id:uid(),bookId:b.id,text:val('q'),page:+val('p')||0,at:Date.now()});
      bumpLog('a'); save();},'Keep it');
  }else{
    sheet('What you saw',`<div class="field"><span class="lbl">Your entry</span>
      <textarea id="n" placeholder="The house was colder than they wrote it. I keep picturing the hallway in green…" style="min-height:130px"></textarea></div>${pg}`,
    ()=>{if(!val('n'))return toast('Write something first'),false;
      db.notes.unshift({id:uid(),bookId:b.id,text:val('n'),page:+val('p')||0,at:Date.now()});
      bumpLog('a'); save();},'Save entry');
  }
}

/* ══ actions ══════════════════════════════════════════════════════*/
function setTab(t){bookTab=t;render()}
function drop(kind,id){if(!confirm('Remove this? It won\'t come back.'))return;
  db[kind]=db[kind].filter(x=>x.id!==id); save(); render();}
function dropBook(id){const b=book(id);
  if(!confirm(`Delete "${b.title}" and everything saved inside it?`))return;
  db.books=db.books.filter(x=>x.id!==id);
  ['words','quotes','notes'].forEach(k=>db[k]=db[k].filter(x=>x.bookId!==id));
  save(); view='home'; openBook=null; render();}
function toggleTheme(){const d=document.documentElement.dataset.theme==='dark';
  db.prefs.theme=d?'light':'dark'; document.documentElement.dataset.theme=db.prefs.theme; save(); render();}
function go(v){view=v; sess=null; if(v!=='book') openBook=null; render();}

document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');
  if(s){e.stopPropagation();e.preventDefault();say(s.dataset.say,s.dataset.audio);}
},true);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-book]');
  if(!t) return;
  if(t.dataset.book){openBook=t.dataset.book;bookTab='words';view='book';
    db.prefs.lastGenre=book(openBook).genre||'literary'; save(); render();}
  else go(t.dataset.go);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  /* the day cards carry a nested play button, so they cannot be <button>s
     themselves — the parser would close them early. They are divs with a
     button's role, which means supplying the keyboard part by hand. */
  if(e.key==='Enter'||e.key===' '){
    const t=e.target.closest?.('[role=button][data-book]');
    if(t){e.preventDefault();t.click();}
  }
  if(view==='practice'&&sess?.kind==='cards'&&sess.queue.length&&!document.getElementById('sh')){
    if(e.key===' '){e.preventDefault();flip()}
    if(sess.flip&&'123'.includes(e.key)) answer([0,4,5][+e.key-1]);
  }
});

if(db.prefs?.theme) document.documentElement.dataset.theme=db.prefs.theme;
/* deep links: home-screen shortcuts land here (#practice, #words) */
const __h=location.hash.replace('#','');
if(db.profile&&(__h==='practice'||__h==='words')) view=__h;
sizeSky(); touchStreak(); render(); askPersist();
if(!calm) raf=requestAnimationFrame(tick);
setTimeout(maybeNotify,2500);

/* ══ the wire ═════════════════════════════════════════════════════
   Offline is a first-class state here: the whole app works without a
   connection, so the pill says what stopped (lookups), not "you're
   broken". Updates arrive via the service worker, one tap to take.
------------------------------------------------------------------*/
function updateNet(){const p=$('#netpill'); if(p) p.classList.toggle('on',navigator.onLine===false)}
addEventListener('online',updateNet); addEventListener('offline',updateNet); updateNet();

let wantReload=false;
if('serviceWorker' in navigator){
  addEventListener('load',async()=>{try{
    const reg=await navigator.serviceWorker.register('./sw.js');
    reg.addEventListener('updatefound',()=>{const nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)
          toastAction('A new LingoBox is ready','Reload',()=>{wantReload=true;nw.postMessage({type:'SKIP_WAITING'})});
      });});
    setInterval(()=>reg.update().catch(()=>{}),6*36e5);
  }catch(e){}});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(wantReload) location.reload()});
}

/* a stray error should never blank the page — the data outlives the bug */
let slipped=false;
const slip=()=>{if(slipped)return;slipped=true;toast('Something slipped — your words are safe')};
addEventListener('error',slip);
addEventListener('unhandledrejection',slip);
</script>
