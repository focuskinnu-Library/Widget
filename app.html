<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Keep the words a book gives you — with the page you met them on.">
<meta name="theme-color" content="#0e0f14">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LingoBox">
<title>LingoBox — a reading companion</title>
<style>
/* ══ genre worlds ═════════════════════════════════════════════════
   Each book lives in a world. The palette and the weather behind the
   page both come from its genre.
------------------------------------------------------------------*/
:root{
  --g1:var(--g1l); --g2:var(--g2l);
  --g1l:#6366f1; --g1d:#a5b0ff; --g2l:#a855f7; --g2d:#cba6ff;
}
[data-genre=romance] {--g1l:#e11d6b;--g1d:#ff8ab4;--g2l:#fb7185;--g2d:#ffb3c4}
[data-genre=fantasy] {--g1l:#7c3aed;--g1d:#c4a6ff;--g2l:#d97706;--g2d:#fbbf24}
[data-genre=thriller]{--g1l:#b91c1c;--g1d:#ff7a7a;--g2l:#475569;--g2d:#94a3b8}
[data-genre=literary]{--g1l:#a16207;--g1d:#e3b341;--g2l:#b45309;--g2d:#f0b46a}
[data-genre=scifi]   {--g1l:#0891b2;--g1d:#4fd6ee;--g2l:#4f46e5;--g2d:#9aa4ff}
[data-genre=nature]  {--g1l:#15803d;--g1d:#5fd39a;--g2l:#65a30d;--g2d:#b7e35a}
[data-genre=horror]  {--g1l:#3f3f46;--g1d:#a1a1aa;--g2l:#991b1b;--g2d:#f87171}
[data-genre=poetry]  {--g1l:#7e22ce;--g1d:#d6a6ff;--g2l:#0d9488;--g2d:#6fd8cd}

:root{
  --bg:#f5f6f9; --surf:#fff; --surf2:#fbfbfd;
  --ink:#0f1117; --ink2:#565d70; --ink3:#8b92a6;
  --line:rgba(15,17,23,.09); --line2:rgba(15,17,23,.055);
  --on-g:#fff; --shadow:0 1px 2px rgba(15,17,23,.05),0 12px 28px -18px rgba(15,17,23,.4);
  --soft:color-mix(in srgb,var(--g1) 12%,#fff);
  --bg-tint:color-mix(in srgb,var(--g1) 4%,#f5f6f9);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r:18px; --r2:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0c11; --surf:#15171e; --surf2:#1a1d25;
  --ink:#f2f4f9; --ink2:#a2a9bb; --ink3:#6d7488;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --on-g:#0b0c11; --shadow:0 1px 2px rgba(0,0,0,.5);
  --g1:var(--g1d); --g2:var(--g2d);
  --soft:color-mix(in srgb,var(--g1) 16%,#15171e);
  --bg-tint:color-mix(in srgb,var(--g1) 5%,#0b0c11);
}}
:root[data-theme=dark]{
  --bg:#0b0c11; --surf:#15171e; --surf2:#1a1d25;
  --ink:#f2f4f9; --ink2:#a2a9bb; --ink3:#6d7488;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --on-g:#0b0c11; --shadow:0 1px 2px rgba(0,0,0,.5);
  --g1:var(--g1d); --g2:var(--g2d);
  --soft:color-mix(in srgb,var(--g1) 16%,#15171e);
  --bg-tint:color-mix(in srgb,var(--g1) 5%,#0b0c11);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); background:var(--bg-tint); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:96px;
  transition:background .6s;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 16px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px;border-radius:8px}
input,textarea,select{
  width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);
  padding:13px 14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 3px var(--soft)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
::placeholder{color:var(--ink3)}

/* ── type ── */
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
h2{font-size:19px;font-weight:750;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink2);font-size:14.5px}
.dim{font-family:var(--mono);color:var(--ink3);font-size:11px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.grad{background:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── shell ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 14px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.ava{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on-g);font-weight:800;font-size:17px}
.iconb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surf);border:1px solid var(--line);color:var(--ink2)}
.iconb:hover{color:var(--ink);border-color:var(--g1)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.navin{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tab{padding:8px 4px 7px;border-radius:12px;font-size:11px;font-weight:650;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s,background .15s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--g1);background:var(--soft)}
.pip{position:absolute;transform:translate(13px,-6px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--g1);color:var(--on-g);font-size:9.5px;font-weight:800;line-height:16px;text-align:center}

/* ── surfaces: everything has an edge ── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.card+.card{margin-top:11px}
.stack{display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.btn{background:linear-gradient(100deg,var(--g1),var(--g2));color:var(--on-g);border-radius:999px;
  padding:14px 22px;font-size:15px;font-weight:750;letter-spacing:-.01em;
  transition:filter .15s,transform .1s;box-shadow:0 8px 22px -12px var(--g1)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--g1);filter:none}
.btn.wide{width:100%}
.btn.sm{padding:10px 16px;font-size:13.5px}
.link{color:var(--g1);font-size:13.5px;font-weight:700}
.link:hover{text-decoration:underline}
.del{font-family:var(--mono);color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px}
.del:hover{color:var(--g1);background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--soft);
  color:var(--g1);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chip.flat{background:var(--line2);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ── book cards ── */
.bookcard{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.bookcard:hover{transform:translateY(-2px);border-color:var(--g1)}
.bookcard .top-strip{height:76px;position:relative;background:linear-gradient(120deg,var(--g1),var(--g2));
  display:flex;align-items:flex-end;padding:12px 15px}
.bookcard .top-strip .gbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-g);background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bookcard .body{padding:13px 15px 15px}
.cov{width:46px;height:68px;border-radius:6px;object-fit:cover;flex:none;background:var(--line2);
  box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.cov.sm{width:34px;height:50px;border-radius:4px}
.cov.ph{display:block;background:linear-gradient(135deg,var(--g1),var(--g2));opacity:.35}
.cov.hero{width:56px;height:82px;border-radius:7px;box-shadow:0 4px 14px -4px rgba(0,0,0,.5)}
.bar{height:7px;background:var(--line2);border-radius:999px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .5s}

/* ── hero ── */
.hero{border-radius:var(--r);padding:20px 18px;color:var(--on-g);position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--shadow)}
.hero h1{color:inherit}
.hero .sub{opacity:.85;font-size:14.5px;margin-top:3px}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .bar i{background:var(--on-g)}
.hero .dim{color:inherit;opacity:.8}
.ring{width:56px;height:56px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── entries ── */
.entry{padding:15px 0;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:0}
.word{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.pron{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-left:7px}
.say{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:7px;border-radius:50%;
  background:var(--soft);color:var(--g1);font-size:9px;vertical-align:middle;flex:none}
.say:hover{transform:scale(1.12)}
.mine{background:var(--soft);border-radius:var(--r2);padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.5}
.mine .lbl{color:var(--g1);display:block;margin-bottom:3px}
.quote{font-family:var(--serif);font-size:17.5px;line-height:1.6;padding-left:15px;border-left:3px solid var(--g1)}
.seg{display:flex;gap:5px;margin:18px 0 6px}
.seg button{flex:1;padding:10px 4px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--ink2);
  background:var(--surf);border:1px solid var(--line)}
.seg button.on{color:var(--on-g);background:var(--g1);border-color:transparent}

/* ── empty states: never a blank page ── */
.empty{background:var(--surf);border:1px dashed var(--line);border-radius:var(--r);padding:30px 22px;text-align:center}
.empty .em{width:52px;height:52px;margin:0 auto 13px;border-radius:16px;display:grid;place-items:center;
  background:var(--soft);color:var(--g1)}
.empty .em svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty h3{margin-bottom:5px}
.empty p{font-size:14px;color:var(--ink2);max-width:290px;margin:0 auto;text-wrap:pretty}

/* ── practice ── */
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--g1)}
.mode .ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--on-g);
  background:linear-gradient(135deg,var(--g1),var(--g2))}
.mode .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flash{background:var(--surf);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:34px 24px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer}
.flash .w{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.02em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{padding:14px 6px;border-radius:var(--r2);border:1px solid var(--line);font-size:13.5px;
  font-weight:750;background:var(--surf)}
.rate button:hover{border-color:var(--g1)}
.rate b{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink3);margin-top:3px;
  letter-spacing:.05em;text-transform:uppercase}
.opt{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r2);padding:15px 16px;margin-top:9px;font-size:15px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--g1)}
.opt.right{border-color:#16a34a;background:color-mix(in srgb,#16a34a 12%,var(--surf))}
.opt.wrong{border-color:#dc2626;background:color-mix(in srgb,#dc2626 12%,var(--surf))}
.prog{height:5px;background:var(--line2);border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}

/* ── genre picker ── */
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gen{padding:11px 8px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surf);text-align:center}
.gen i{width:100%;height:26px;border-radius:8px;display:block;margin-bottom:7px}
.gen span{font-size:11.5px;font-weight:650;color:var(--ink2)}
.gen.on{border-color:var(--g1);box-shadow:0 0 0 2px var(--soft)}
.gen.on span{color:var(--g1)}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:50;animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);border-radius:24px 24px 0 0;
  max-width:600px;margin:0 auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1);border-top:1px solid var(--line)}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 16px}
.field{margin-bottom:14px}
.field .lbl{display:block;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.inline{display:flex;gap:8px}.inline input{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 19px;border-radius:999px;font-size:13.5px;font-weight:650;z-index:60;animation:fade .2s;white-space:nowrap}
.fade{animation:fade .35s}

/* lookup panel */
.lk{margin-top:10px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.lkh{padding:10px 13px;background:var(--soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sense{display:block;width:100%;text-align:left;padding:12px 13px;border-top:1px solid var(--line2)}
.sense:hover{background:var(--soft)}
.sense .pos{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--g1)}
.sense p{font-size:14px;line-height:1.45;margin-top:3px}
.sense em{display:block;font-family:var(--serif);font-size:13px;color:var(--ink3);margin-top:4px}
.syn{padding:10px 13px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:5px}
.hear{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.hear a{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  font-size:12px;font-weight:650;color:var(--ink2);text-decoration:none}
.hear a:hover{border-color:var(--g1);color:var(--g1)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app"></div>
<nav id="nav"></nav>

<script>
'use strict';
/* ─────────────────────────────────────────────────────────────────
   LingoBox — keep the words a book gives you.
   Everything lives on this device.
──────────────────────────────────────────────────────────────────*/
const KEY='lingobox.v1', OLD_KEY='margin.v1', DAY=864e5;

/* Genre worlds. The palette and the weather both come from here. */
const GENRES=[
  {id:'romance', name:'Romance',  fx:'petal', a:'#e11d6b', b:'#fb7185', line:'Petals, and someone worth the trouble.'},
  {id:'fantasy', name:'Fantasy',  fx:'ember', a:'#7c3aed', b:'#d97706', line:'Embers rising off something old and magic.'},
  {id:'thriller',name:'Thriller', fx:'rain',  a:'#b91c1c', b:'#475569', line:'Rain on glass, and nobody telling the truth.'},
  {id:'literary',name:'Literary', fx:'dust',  a:'#a16207', b:'#b45309', line:'Dust in a shaft of afternoon light.'},
  {id:'scifi',   name:'Sci-fi',   fx:'star',  a:'#0891b2', b:'#4f46e5', line:'Stars going past the window, slowly.'},
  {id:'nature',  name:'Nature',   fx:'leaf',  a:'#15803d', b:'#65a30d', line:'Leaves coming down, unhurried.'},
  {id:'horror',  name:'Horror',   fx:'fog',   a:'#3f3f46', b:'#991b1b', line:'Fog that has been there a while.'},
  {id:'poetry',  name:'Poetry',   fx:'mote',  a:'#7e22ce', b:'#0d9488', line:'Small bright things drifting upward.'}
];
const genreOf=id=>GENRES.find(g=>g.id===id)||GENRES[3];

let db=load(), view='home', openBook=null, bookTab='words', sess=null, draft=null;

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY));
    if(d&&d.books) return Object.assign({books:[],words:[],quotes:[],notes:[],profile:null,prefs:{}},d);
  }catch(e){}
  return {books:[],words:[],quotes:[],notes:[],profile:null,prefs:{}};
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const book=id=>db.books.find(b=>b.id===id);
const $=s=>document.querySelector(s);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function when(ts){const d=Math.floor((Date.now()-ts)/DAY);
  return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .3s'},1600);setTimeout(()=>t.remove(),1950);}

/* ══ the weather ══════════════════════════════════════════════════
   A canvas behind the page. Each genre gets its own drift. Skipped
   entirely when the reader asks for reduced motion.
------------------------------------------------------------------*/
const sky=$('#sky'), ctx=sky.getContext('2d');
let parts=[], fxKind='dust', W=0, H=0, raf=0;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

function sizeSky(){const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;sky.width=W*d;sky.height=H*d;sky.style.width=W+'px';sky.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',()=>{sizeSky();seed(fxKind)});

const COUNT={petal:16,ember:22,rain:34,dust:26,star:40,leaf:12,fog:7,mote:20};
function seed(kind){
  fxKind=kind; parts=[];
  const n=calm?0:COUNT[kind]||18;
  for(let i=0;i<n;i++) parts.push(mk(kind,true));
}
function mk(k,init){
  const y=init?Math.random()*H:-30;
  switch(k){
    case 'petal': return {x:Math.random()*W,y,r:5+Math.random()*6,vy:.25+Math.random()*.45,vx:-.25+Math.random()*.5,a:Math.random()*6.3,va:(Math.random()-.5)*.05,o:.35+Math.random()*.35};
    case 'ember': return {x:Math.random()*W,y:init?Math.random()*H:H+20,r:1+Math.random()*2.2,vy:-(.25+Math.random()*.6),vx:-.2+Math.random()*.4,o:.3+Math.random()*.5,tw:Math.random()*6.3};
    case 'rain':  return {x:Math.random()*W,y,len:9+Math.random()*16,vy:5+Math.random()*5,vx:-.7,o:.16+Math.random()*.22};
    case 'dust':  return {x:Math.random()*W,y:init?Math.random()*H:Math.random()*H,r:.8+Math.random()*1.6,vy:-.06+Math.random()*.12,vx:.12+Math.random()*.25,o:.18+Math.random()*.3};
    case 'star':  return {x:Math.random()*W,y:init?Math.random()*H:Math.random()*H,r:.5+Math.random()*1.4,vy:0,vx:-(.08+Math.random()*.35),o:.25+Math.random()*.55,tw:Math.random()*6.3};
    case 'leaf':  return {x:Math.random()*W,y,r:6+Math.random()*7,vy:.3+Math.random()*.4,vx:-.3+Math.random()*.6,a:Math.random()*6.3,va:(Math.random()-.5)*.035,o:.3+Math.random()*.3};
    case 'fog':   return {x:Math.random()*W,y:Math.random()*H,r:70+Math.random()*120,vy:-.02+Math.random()*.04,vx:.08+Math.random()*.16,o:.05+Math.random()*.07};
    default:      return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:1+Math.random()*2,vy:-(.15+Math.random()*.35),vx:-.15+Math.random()*.3,o:.25+Math.random()*.4,tw:Math.random()*6.3};
  }
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888'}
let c1='#888',c2='#888';
function refreshColors(){c1=css('--g1');c2=css('--g2')}

function tick(t){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy;
    if(p.a!==undefined) p.a+=p.va;
    if(p.y>H+40||p.y<-60||p.x>W+80||p.x<-80){Object.assign(p,mk(fxKind,false));continue}
    ctx.save(); ctx.globalAlpha=p.o;
    switch(fxKind){
      case 'petal':
        ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=c2;
        ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,6.3);ctx.fill();break;
      case 'ember':
        ctx.globalAlpha=p.o*(.6+.4*Math.sin(t/380+p.tw));ctx.fillStyle=c2;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();break;
      case 'rain':
        ctx.strokeStyle=c2;ctx.lineWidth=1.1;ctx.beginPath();
        ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*2.2,p.y+p.len);ctx.stroke();break;
      case 'dust':
        ctx.fillStyle=c1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();break;
      case 'star':
        ctx.globalAlpha=p.o*(.5+.5*Math.sin(t/700+p.tw));ctx.fillStyle=c1;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();break;
      case 'leaf':
        ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=c1;
        ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.42,0,0,6.3);ctx.fill();break;
      case 'fog':
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0,c1);g.addColorStop(1,'transparent');ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();break;
      default:
        ctx.globalAlpha=p.o*(.55+.45*Math.sin(t/500+p.tw));ctx.fillStyle=c2;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();
    }
    ctx.restore();
  }
  raf=requestAnimationFrame(tick);
}
function applyWorld(){
  const b=openBook&&book(openBook);
  const id=draft||(b?b.genre:db.prefs.lastGenre)||'literary';
  document.documentElement.dataset.genre=id;
  refreshColors();
  const k=genreOf(id).fx;
  if(k!==fxKind||!parts.length) seed(k);
}

/* ══ spaced repetition (SM-2) ═════════════════════════════════════*/
const fresh=()=>({ease:2.5,reps:0,interval:0,due:Date.now()});
function grade(w,q){
  const c=w.srs||(w.srs=fresh());
  if(q<3){c.reps=0;c.interval=0;c.due=Date.now()+6e5;}
  else{c.reps++;c.interval=c.reps===1?1:c.reps===2?6:Math.round(c.interval*c.ease);
    c.ease=Math.max(1.3,c.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.due=Date.now()+c.interval*DAY;}
  save();
}
const due=()=>db.words.filter(w=>(w.srs?.due??0)<=Date.now());
function nextIn(w,q){const c=w.srs||fresh();const r=c.reps+1;
  const i=r===1?1:r===2?6:Math.round(c.interval*c.ease*(q===5?1.3:1));
  return i===1?'tomorrow':i<31?i+' days':Math.round(i/30)+' months';}

/* ══ streak ══════════════════════════════════════════════════════*/
function touchStreak(){
  const p=db.profile; if(!p) return;
  const today=new Date().toDateString();
  if(p.lastDay===today) return;
  const y=new Date(Date.now()-DAY).toDateString();
  p.streak=(p.lastDay===y)?(p.streak||0)+1:1;
  p.lastDay=today; save();
}

/* ══ dictionary ═══════════════════════════════════════════════════*/
const SOURCES=[
  {name:'Free Dictionary',url:w=>'https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),parse:pFree},
  {name:'Wiktionary',url:w=>'https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(w),parse:pWik}
];
const fail=(code,m)=>Object.assign(new Error(m),{code});
function stripTags(h){const d=new DOMParser().parseFromString(String(h||''),'text/html');
  return (d.body.textContent||'').replace(/\s+/g,' ').trim();}
function pFree(j){const d=j[0],s=[];
  (d.meanings||[]).forEach(m=>(m.definitions||[]).slice(0,2).forEach(x=>
    s.push({pos:m.partOfSpeech||'',def:x.definition,ex:x.example||''})));
  return{phonetic:d.phonetic||(d.phonetics||[]).find(p=>p.text)?.text||'',
    audio:(d.phonetics||[]).find(p=>p.audio)?.audio||'',senses:s.slice(0,5),
    syn:[...new Set((d.meanings||[]).flatMap(m=>m.synonyms||[]))].slice(0,6)};}
// Wiktionary keys its answer by language. Reading only `en` threw away every
// other one — so a word like "pyar" came back as if it did not exist. English
// first, then whatever language actually has it.
const LANGS={en:'English',hi:'Hindi',ur:'Urdu',es:'Spanish',fr:'French',de:'German',it:'Italian',
  pt:'Portuguese',nl:'Dutch',ru:'Russian',ja:'Japanese',zh:'Chinese',ko:'Korean',ar:'Arabic',
  fa:'Persian',bn:'Bengali',ta:'Tamil',te:'Telugu',mr:'Marathi',gu:'Gujarati',pa:'Punjabi',
  la:'Latin',el:'Greek',tr:'Turkish',pl:'Polish',sv:'Swedish',he:'Hebrew'};
function pWik(j){
  const has=k=>(j[k]||[]).some(sec=>(sec.definitions||[]).length);
  const lang=has('en')?'en':Object.keys(j||{}).find(has);
  if(!lang) return{phonetic:'',audio:'',senses:[],syn:[],lang:''};
  const s=[];
  (j[lang]||[]).forEach(sec=>(sec.definitions||[]).slice(0,3).forEach(d=>{
    const t=stripTags(d.definition); if(!t) return;
    s.push({pos:(sec.partOfSpeech||'').toLowerCase(),def:t,
      ex:stripTags((d.parsedExamples||[])[0]?.example||(d.examples||[])[0]||'')});}));
  return{phonetic:'',audio:'',senses:s.slice(0,5),syn:[],lang};}

async function lookup(term){
  const w=term.trim().toLowerCase(); let reachable=false;
  for(const s of SOURCES){
    let r; try{r=await fetch(s.url(w))}catch(e){continue}
    reachable=true;
    if(r.status===404||!r.ok) continue;
    try{
      const p=s.parse(await r.json());
      if(p.senses.length){
        const tag=p.lang&&p.lang!=='en' ? s.name+' · '+(LANGS[p.lang]||p.lang.toUpperCase()) : s.name;
        return Object.assign(p,{source:tag});
      }
    }catch(e){}
  }
  throw reachable?fail('none','no entry'):fail('unreachable','nothing reachable');
}

/* Hearing a word said by actual people, and seeing it used. */
const hearLinks=w=>`<div class="hear">
  <a href="https://youglish.com/pronounce/${encodeURIComponent(w)}/english" target="_blank" rel="noopener">▸ Real speakers ↗</a>
  <a href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(w)}" target="_blank" rel="noopener">Cambridge ↗</a>
  <a href="https://forvo.com/word/${encodeURIComponent(w)}/#en" target="_blank" rel="noopener">Forvo ↗</a>
  <a href="https://www.google.com/search?q=${encodeURIComponent(w+' meaning')}" target="_blank" rel="noopener">Search the web ↗</a></div>`;

async function doLookup(){
  const term=($('#w')?.value||'').trim(), box=$('#lk');
  if(!term||!box) return;
  box.innerHTML=`<div class="lkh"><span class="lbl">Looking up ${esc(term)}…</span></div>`;
  try{
    const r=await lookup(term); window.__senses=r.senses;
    box.innerHTML=`<div class="lkh"><span class="word" style="font-size:17px">${esc(term)}</span>
      ${r.phonetic?`<span class="pron">${esc(r.phonetic)}</span>`:''}
      <button class="say" data-say="${esc(term)}" data-audio="${esc(r.audio||'')}" aria-label="Hear ${esc(term)}">▸</button>
      <span class="lbl" style="margin-left:auto">${esc(r.source)}</span></div>`
      +(r.senses.map((s,i)=>`<button type="button" class="sense" onclick="useSense(${i})">
        ${s.pos?`<span class="pos">${esc(s.pos)}</span>`:''}<p>${esc(s.def)}</p>
        ${s.ex?`<em>"${esc(s.ex)}"</em>`:''}</button>`).join(''))
      +(r.syn.length?`<div class="syn">${r.syn.map(s=>`<span class="chip flat">${esc(s)}</span>`).join('')}</div>`:'')
      +`<div style="padding:10px 13px;border-top:1px solid var(--line2)">${hearLinks(term)}</div>`;
    if($('#ph')) $('#ph').value=r.phonetic||'';
    if($('#au')) $('#au').value=r.audio||'';
  }catch(e){
    // The browser knows whether it has a connection. If it does and the request
    // still never left, the page is blocking it — say that, rather than making
    // someone go and check their wifi.
    const offline = ('onLine' in navigator) && navigator.onLine === false;
    const head = e.code==='none' ? `No entry for “${esc(term)}”`
               : offline         ? 'You’re offline'
                                 : 'This page blocked the lookup';
    const why  = e.code==='none' ? 'Both dictionaries are word-by-word references, strongest in English. If it is from another language, a name, or very new, the links below will find it — then write the meaning in your own words.'
               : offline         ? 'Your device says it has no connection. Try again once you’re back online — or write the meaning yourself, which works either way.'
                                 : 'Your connection is fine. Previews like this one refuse outside requests, so the dictionary can’t be reached from here. Open LingoBox from its own address and Look up works. You can still write the meaning yourself below.';
    box.innerHTML=`<div class="lkh" style="display:block">
      <span class="lbl">${head}</span>
      <div style="font-size:13.5px;line-height:1.5;margin-top:5px;color:var(--ink2)">${why}</div>
      ${hearLinks(term)}</div>`;
  }
}
function useSense(i){
  const s=(window.__senses||[])[i]; if(!s) return;
  $('#m').value=(s.pos?s.pos+' — ':'')+s.def;
  if(s.ex&&!$('#c').value.trim()) $('#c').value=s.ex;
  toast('Kept — now put it in your words'); $('#mine')?.focus();
}

/* ══ finding a book ═══════════════════════════════════════════════
   Open Library is free, needs no key, and answers browsers directly.
   One search fills in the author, the length and the cover.
------------------------------------------------------------------*/
const coverUrl=(id,size)=>`https://covers.openlibrary.org/b/id/${id}-${size||'M'}.jpg`;

async function findBook(){
  const q=($('#t')?.value||'').trim(), box=$('#fb');
  if(!q||!box) return;
  box.innerHTML=`<div class="lkh" style="border-radius:var(--r2)"><span class="lbl">Searching…</span></div>`;
  try{
    const r=await fetch('https://openlibrary.org/search.json?limit=5&fields=title,author_name,number_of_pages_median,first_publish_year,cover_i&q='+encodeURIComponent(q));
    if(!r.ok) throw 0;
    const docs=(await r.json()).docs||[];
    if(!docs.length){box.innerHTML=`<div class="lkh" style="border-radius:var(--r2)"><span class="lbl">Nothing found — just type it in</span></div>`;return}
    window.__found=docs;
    box.innerHTML=`<div class="lk">${docs.map((d,i)=>`
      <button type="button" class="sense" style="display:flex;gap:11px;align-items:center" onclick="useBook(${i})">
        ${d.cover_i?`<img src="${coverUrl(d.cover_i,'S')}" alt="" class="cov sm" onerror="this.style.visibility='hidden'">`
                   :`<span class="cov sm ph"></span>`}
        <span style="flex:1;min-width:0"><span style="font-weight:700;font-size:14.5px">${esc(d.title||'')}</span>
        <span class="dim" style="display:block;margin-top:2px">${esc((d.author_name||[])[0]||'—')}${d.first_publish_year?' · '+d.first_publish_year:''}${d.number_of_pages_median?' · '+d.number_of_pages_median+'pp':''}</span></span>
      </button>`).join('')}</div>`;
  }catch(e){
    box.innerHTML=`<div class="lkh" style="border-radius:var(--r2);display:block">
      <span class="lbl">${navigator.onLine===false?'You’re offline':'This page blocked the search'}</span>
      <div style="font-size:13px;margin-top:4px;color:var(--ink2)">Type the details in yourself — it all works the same.</div></div>`;
  }
}
function useBook(i){
  const d=(window.__found||[])[i]; if(!d) return;
  $('#t').value=d.title||''; $('#a').value=(d.author_name||[])[0]||'';
  if(d.number_of_pages_median&&!$('#tp').value) $('#tp').value=d.number_of_pages_median;
  draftCover=d.cover_i?coverUrl(d.cover_i,'M'):'';
  $('#fb').innerHTML=`<div class="lkh" style="border-radius:var(--r2);display:flex;gap:10px;align-items:center">
    ${draftCover?`<img src="${draftCover}" alt="" class="cov sm" onerror="this.style.visibility='hidden'">`:''}
    <span class="lbl">Filled in — change anything you like</span></div>`;
  toast('Found it');
}

/* ══ keeping the data ═════════════════════════════════════════════
   Ask the browser to treat this as worth keeping, so it is not the
   first thing evicted when the device runs short.
------------------------------------------------------------------*/
async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return;
    if(navigator.storage.persisted && await navigator.storage.persisted()){db.prefs.persisted=true;save();return}
    db.prefs.persisted=await navigator.storage.persist(); save();
  }catch(e){}
}

/* ══ saying it ════════════════════════════════════════════════════*/
function say(word,url){
  if(!word) return;
  if(url){const a=new Audio(url);a.play().then(()=>{}).catch(()=>speak(word));return}
  speak(word);
}
function speak(w){
  if(!('speechSynthesis' in window)) return toast('No voice on this device');
  const u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const sayBtn=(w,a)=>`<button class="say" data-say="${esc(w)}" data-audio="${esc(a||'')}" aria-label="Hear ${esc(w)}">▸</button>`;

/* ══ listening ════════════════════════════════════════════════════
   The browser can hear. Say the word and it checks you — no network,
   no key, and nothing recorded anywhere.
------------------------------------------------------------------*/
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canListen=!!SR;
const flat=t=>String(t||'').toLowerCase().replace(/[^a-z]/g,'');

function listen(){
  if(!SR) return toast('This browser can’t listen');
  const w=sess.queue[0];
  let rec;
  try{ rec=new SR(); }catch(e){ return toast('This browser can’t listen') }
  rec.lang='en-GB'; rec.interimResults=false; rec.maxAlternatives=5;
  sess.listening=true; sess.heard=''; sess.micErr=''; render();
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>String(a.transcript||'').trim());
    const hit=alts.some(a=>flat(a)===flat(w.word));
    sess.heard=alts[0]||''; sess.listening=false; sess.picked=hit?'ok':'no';
    grade(w,hit?4:0); if(hit) sess.done++;
    render();
  };
  rec.onerror=e=>{
    sess.listening=false;
    sess.micErr = e.error==='not-allowed' ? 'Microphone permission was refused.'
                : e.error==='no-speech'   ? 'Didn’t catch anything — try again.'
                : 'The microphone isn’t available here.';
    render();
  };
  rec.onend=()=>{ if(sess&&sess.listening){sess.listening=false;render()} };
  try{ rec.start(); }catch(e){ sess.listening=false; sess.micErr='Could not start listening.'; render(); }
}

/* ══ a quote worth sharing ════════════════════════════════════════
   Drawn on a canvas in the book's own colours. Nothing is uploaded —
   the image is made here and handed to the share sheet.
------------------------------------------------------------------*/
function wrapText(x,text,maxW,size){
  x.font=`600 ${size}px Georgia, 'Iowan Old Style', serif`;
  const words=String(text).split(/\s+/), lines=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(x.measureText(t).width>maxW&&line){lines.push(line);line=w} else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
async function shareQuote(id){
  const q=db.quotes.find(x=>x.id===id); if(!q) return;
  const b=book(q.bookId), g=genreOf(b&&b.genre);
  const S=1080, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  const grad=x.createLinearGradient(0,0,S,S);
  grad.addColorStop(0,g.a); grad.addColorStop(1,g.b);
  x.fillStyle=grad; x.fillRect(0,0,S,S);
  x.fillStyle='rgba(255,255,255,.10)';
  for(let i=0;i<40;i++){const r=6+Math.random()*26;
    x.beginPath();x.arc(Math.random()*S,Math.random()*S,r,0,6.3);x.fill();}
  // a big soft quotation mark, the way a pull-quote is set
  x.save(); x.globalAlpha=.22; x.fillStyle='#fff';
  x.font="700 260px Georgia, 'Iowan Old Style', serif";
  x.fillText('\u201C',60,300); x.restore();
  x.fillStyle='#fff';
  let size=64;
  let lines=wrapText(x,q.text,S-190,size);
  while(lines.length>9&&size>34){size-=4;lines=wrapText(x,q.text,S-190,size);}
  x.font=`600 ${size}px Georgia, 'Iowan Old Style', serif`;
  const lh=size*1.38, top=(S-lines.length*lh)/2 - 30;
  lines.forEach((l,i)=>x.fillText(l,95,top+i*lh+size));
  x.globalAlpha=.9; x.font='500 30px -apple-system, Helvetica, Arial, sans-serif';
  const who=(b?b.title:'')+(b&&b.author?' · '+b.author:'')+(q.page?' · p.'+q.page:'');
  x.fillText(who.slice(0,64),95,S-140);
  x.globalAlpha=.78; x.font='800 27px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText('LingoBox',95,S-86);
  c.toBlob(async blob=>{
    if(!blob) return toast('Could not make the image');
    const file=new File([blob],`lingobox-quote-${stamp()}.png`,{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file]}); return;
      }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    if(window.claude?.downloads?.save){
      try{ await window.claude.downloads.save({filename:file.name,data:blob}); toast('Saved'); }
      catch(e){ if(e&&e.code!=='declined') toast('Could not save here'); }
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{href:url,download:file.name});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Image saved');
  },'image/png');
}

/* ══ notifications ════════════════════════════════════════════════
   Local only: the browser reminds you when words are going stale.
   No server, so nothing arrives while the app is closed.
------------------------------------------------------------------*/
async function askNotify(){
  if(!('Notification' in window)) return toast('This browser has no notifications');
  const p=await Notification.requestPermission();
  db.prefs.notify=(p==='granted'); save(); render();
  toast(p==='granted'?'Reminders on':'Reminders stay off');
}
function maybeNotify(){
  if(!db.prefs.notify||!('Notification' in window)||Notification.permission!=='granted') return;
  const n=due().length; if(!n) return;
  const last=db.prefs.notifiedAt||0;
  if(Date.now()-last<12*36e5) return;
  try{
    new Notification(`${n} word${n>1?'s':''} going stale`,
      {body:'A minute of practice and they stay yours.',tag:'lingobox-due'});
    db.prefs.notifiedAt=Date.now(); save();
  }catch(e){}
}

/* ══ export / import ══════════════════════════════════════════════*/
const stamp=()=>new Date().toISOString().slice(0,10);
async function offer(filename,text,mime){
  if(window.claude?.downloads?.save){
    try{await window.claude.downloads.save({filename,data:text});toast('Saved')}
    catch(e){if(e&&e.code!=='declined')toast('Could not save here')}
    return;
  }
  const url=URL.createObjectURL(new Blob([text],{type:mime}));
  const a=Object.assign(document.createElement('a'),{href:url,download:filename});
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Downloaded');
}
const exportBackup=()=>offer(`lingobox-backup-${stamp()}.json`,JSON.stringify(db,null,2),'application/json');
function exportMarkdown(){
  const L=[`# LingoBox — ${stamp()}`,''];
  db.books.forEach(b=>{
    L.push(`## ${b.title}`,`*${b.author||'—'}* · ${genreOf(b.genre).name} · page ${b.page||0}${b.pages?' of '+b.pages:''}`,'');
    const of=k=>db[k].filter(x=>x.bookId===b.id);
    const ws=of('words');
    if(ws.length){L.push('### Words','');ws.forEach(w=>{
      L.push(`**${w.word}**${w.phonetic?' '+w.phonetic:''}${w.page?` · p.${w.page}`:''}`);
      if(w.meaning&&w.meaning!=='—')L.push(`- ${w.meaning}`);
      if(w.mine)L.push(`- *In my words:* ${w.mine}`);
      if(w.context)L.push(`- Found in: "${w.context}"`); L.push('');});}
    const qs=of('quotes');
    if(qs.length){L.push('### Quotes','');qs.forEach(q=>L.push('> '+q.text.replace(/\n/g,'\n> '),q.page?`— p.${q.page}`:'',''));}
    const ns=of('notes');
    if(ns.length){L.push('### Journal','');ns.forEach(n=>L.push(`**${new Date(n.at).toLocaleDateString()}**${n.page?` · p.${n.page}`:''}`,'',n.text,''));}
  });
  offer(`lingobox-${stamp()}.md`,L.join('\n'),'text/markdown');
}
function exportAnki(){
  const q=t=>'"'+String(t==null?'':t).replace(/"/g,'""')+'"';
  const rows=db.words.map(w=>{const b=book(w.bookId);
    const back=[w.mine,(w.meaning&&w.meaning!=='—')?w.meaning:'',b?b.title+(w.page?' · p.'+w.page:''):''].filter(Boolean).join('<br><br>');
    return q(w.word)+','+q(back);});
  if(!rows.length) return toast('No words to export yet');
  offer(`lingobox-anki-${stamp()}.txt`,rows.join('\n'),'text/plain');
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch(e){return toast('That is not a LingoBox backup')}
    if(!d||!Array.isArray(d.books)) return toast('That is not a LingoBox backup');
    let n=0;
    ['books','words','quotes','notes'].forEach(k=>{
      const have=new Set((db[k]||[]).map(x=>x.id));
      (d[k]||[]).forEach(x=>{if(x&&x.id&&!have.has(x.id)){db[k].push(x);n++}});});
    if(d.profile&&!db.profile) db.profile=d.profile;
    save(); closeSheet(); render();
    toast(n?`${n} item${n>1?'s':''} restored`:'Already up to date');
  };
  r.readAsText(f);
}

/* ══ render ═══════════════════════════════════════════════════════*/
function render(){
  applyWorld();
  const app=$('#app');
  app.innerHTML = !db.profile ? onboard()
    : view==='home'? home() : view==='book'? bookView()
    : view==='words'? dict() : view==='practice'? practice() : you();
  app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
  drawNav();
  scrollTo(0,0);
}
function drawNav(){
  const nav=$('#nav');
  if(!db.profile){nav.style.display='none';return}
  nav.style.display='';
  const n=due().length, active=view==='book'?'home':view;
  nav.innerHTML=`<div class="navin">${[
    ['home','Shelf','shelf'],['words','Words','words'],
    ['practice','Practice','practice'],['you','You','you']
  ].map(([v,label,ic])=>`<button class="tab ${active===v?'on':''}" data-go="${v}">
      ${svg(ic)}${v==='practice'&&n?`<span class="pip">${n}</span>`:''}<span>${label}</span></button>`).join('')}</div>`;
}

    <circle cx="28" cy="28" r="${r}" stroke="var(--g1)" stroke-width="5" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/></svg>`;}

/* ── words ── */
function dict(){
  const q=(window.__q||'').toLowerCase();
  const all=db.words.filter(w=>!q||w.word.toLowerCase().includes(q)||(w.meaning||'').toLowerCase().includes(q)||(w.mine||'').toLowerCase().includes(q))
    .sort((a,b)=>a.word.toLowerCase().localeCompare(b.word.toLowerCase()));
  let out='',L='';
  all.forEach(w=>{
    const l=w.word[0].toUpperCase();
    if(l!==L){L=l;out+=`<div class="lbl grad" style="margin:18px 0 2px;font-size:13px;font-weight:800">${esc(l)}</div>`}
    const b=book(w.bookId), d=w.srs?Math.ceil((w.srs.due-Date.now())/DAY):0;
    out+=`<div class="entry">
      <div class="row" style="align-items:flex-start"><div style="min-width:0">
        <span class="word">${esc(w.word)}</span>${w.phonetic?`<span class="pron">${esc(w.phonetic)}</span>`:''}${sayBtn(w.word,w.audio)}</div>
        <span class="chip">${d<=0?'due now':'in '+d+'d'}</span></div>
      ${w.mine?`<div class="mine"><span class="lbl">In your words</span>${nl(w.mine)}</div>`
              :`<div class="muted" style="margin-top:5px">${nl(w.meaning)}</div>`}
      <div class="dim" style="margin-top:8px">${b?esc(b.title)+(w.page?' · p.'+w.page:''):''}</div>
      ${hearLinks(w.word)}</div>`;
  });
  return `<div class="top"><div><h1>Your <span class="grad">dictionary</span></h1>
      <div class="dim" style="margin-top:3px">${db.words.length} word${db.words.length===1?'':'s'}, each carrying its page</div></div>
      <button class="iconb" onclick="toggleTheme()" aria-label="Light or dark">${document.documentElement.dataset.theme==='dark'?'☀':'☾'}</button></div>
    ${db.words.length?`<input placeholder="Search your words…" value="${esc(window.__q||'')}" oninput="window.__q=this.value;redraw()">
      <div class="card" style="margin-top:12px" id="dl">${out||emptyBlock('words','Nothing matches','Try a different word, or clear the search.')}</div>`
    :`<div class="empty"><div class="em">${svg('words')}</div><h3>No words yet</h3>
      <p>Open a book, tap Add a word, and this becomes a dictionary nobody else has.</p>
      <button class="btn sm" style="margin-top:16px" data-go="home">Go to my shelf</button></div>`}`;
}

  const y=scrollY, t=document.createElement('div'); t.innerHTML=dict();
  el.innerHTML=t.querySelector('#dl').innerHTML; scrollTo(0,y);}

function practice(){

  if(!total) return `<div class="top"><h1>Practice</h1></div>
    <div class="empty"><div class="em">${svg('practice')}</div><h3>Nothing to practise yet</h3>

  const modes=[
    ['cards','Flashcards','Your wording first, the dictionary underneath.',n?`${n} due`:'practise anyway','flash'],
    ['quiz','Quiz','Four meanings, one word. Fastest way to find the gaps.',total<4?'needs 4 words':'any time','quiz'],
    ['spell','Spelling','Hear it, then spell it. Harder than it sounds.',total<1?'—':'any time','spell'],
    ['speak','Say it','The app listens and tells you if you got it.',canListen?'any time':'not in this browser','say']
  ];
  return `<div class="top"><div><h1>Practice</h1>
      <div class="dim" style="margin-top:3px">${n?`${n} word${n>1?'s':''} due now`:'all caught up'}</div></div>

      <button class="mode" onclick="startSession('${id}')">
        <div class="ic">${svg(ic)}</div>
        <div style="flex:1;min-width:0"><h3>${h}</h3>
          <p class="muted" style="font-size:13.5px;margin-top:2px">${p}</p></div>
        <span class="chip" style="flex:none">${meta}</span></button>`).join('')}</div>
    <div class="card" style="margin-top:18px"><div class="row">
      <div><h3>Reminders</h3><p class="muted" style="font-size:13.5px;margin-top:2px">
      ${db.prefs.notify?'On — your browser nudges you when words go stale.':'Off. We only ever nudge about your own words.'}</p></div>
      <button class="btn ghost sm" onclick="askNotify()">${db.prefs.notify?'Re-check':'Turn on'}</button></div></div>`;
}
function startSession(kind){
  const pool=due().length?due():db.words;
  if(kind==='quiz'&&db.words.length<4) return toast('Save at least four words first');
  if(kind==='speak'&&!canListen) return toast('This browser can’t listen — try Chrome or Safari');
  if(!pool.length) return toast('Nothing to practise');
  sess={kind,queue:shuffle(pool.slice(0,20)),i:0,done:0,flip:false,picked:null,total:Math.min(20,pool.length)};
  render();
}
function endSession(){const d=sess?sess.done:0; sess=null; render();
  toast(d?`${d} reviewed — nicely done`:'Come back any time');}

function runSession(){
  const s=sess;
  if(!s.queue.length){
    sess=null;
    return `<div class="top"><h1>Done</h1></div>
      <div class="empty"><div class="em" style="font-size:26px">✓</div>
      <h3>${s.done} word${s.done===1?'':'s'} practised</h3>
      <p>They'll come back when you're just about to forget them. That's the whole trick.</p>
      <button class="btn sm" style="margin-top:16px" data-go="home">Back to my shelf</button></div>`;
  }
  const w=s.queue[0], b=book(w.bookId), n=s.total-s.queue.length+1;
  const head=`<div class="top"><button class="iconb" onclick="endSession()" aria-label="Stop">✕</button>
      <span class="chip">${n} of ${s.total}</span>
      <span class="dim">${b?esc(b.title):''}</span></div>
    <div class="prog"><i style="width:${(n-1)/s.total*100}%"></i></div>`;

  if(s.kind==='cards') return head+`
    <div class="flash" onclick="flip()">
      ${s.flip?`<div class="w" style="font-size:24px">${esc(w.word)}${sayBtn(w.word,w.audio)}</div>
        ${w.mine?`<div style="margin-top:14px;font-size:17px;line-height:1.55;max-width:340px">${nl(w.mine)}</div>
          <div class="lbl" style="margin-top:14px">What the dictionary says</div>`:''}
        <div style="margin-top:${w.mine?6:14}px;font-size:${w.mine?14:16}px;line-height:1.55;color:var(--ink2);max-width:340px">${nl(w.meaning)}</div>
        ${w.context?`<div class="serif" style="margin-top:14px;font-style:italic;color:var(--ink3);font-size:14px;max-width:340px">"${nl(w.context)}"</div>`:''}`
      :`<div class="w">${esc(w.word)}${sayBtn(w.word,w.audio)}</div>
        <div class="dim" style="margin-top:16px">Tap to reveal</div>`}
    </div>
    ${s.flip?`<div class="rate">
      <button onclick="answer(0)">Again<b>&lt; 10 min</b></button>
      <button onclick="answer(4)">Good<b>${nextIn(w,4)}</b></button>
      <button onclick="answer(5)">Easy<b>${nextIn(w,5)}</b></button></div>`
    :`<div class="dim" style="text-align:center;margin-top:16px">Say it out loud before you flip</div>`}`;

  if(s.kind==='quiz'){
    if(!s.opts){
      const wrong=shuffle(db.words.filter(x=>x.id!==w.id)).slice(0,3);
      s.opts=shuffle([w,...wrong]);
    }
    const prompt=(w.mine||w.meaning||'').trim();
    return head+`<div class="card"><span class="lbl">Which word means…</span>
      <p class="serif" style="font-size:19px;line-height:1.5;margin-top:8px">${nl(prompt)}</p>
      ${b?`<div class="dim" style="margin-top:10px">${esc(b.title)}${w.page?' · p.'+w.page:''}</div>`:''}</div>
      <div style="margin-top:6px">${s.opts.map((o,i)=>`<button class="opt ${s.picked?(o.id===w.id?'right':(s.picked===o.id?'wrong':'')):''}"
        ${s.picked?'disabled':''} onclick="pick('${o.id}')"><span class="word" style="font-size:17px">${esc(o.word)}</span></button>`).join('')}</div>
      ${s.picked?`<button class="btn wide" style="margin-top:14px" onclick="nextQ()">Next →</button>`:''}`;
  }

  if(s.kind==='speak'){
    return head+`<div class="card" style="text-align:center;padding:26px 18px">
        <span class="lbl">Which word is this? Say it out loud</span>
        <p class="serif" style="font-size:19px;line-height:1.5;margin-top:10px">${nl(w.mine||w.meaning)}</p>
        ${b?`<div class="dim" style="margin-top:10px">${esc(b.title)}${w.page?' · p.'+w.page:''}</div>`:''}</div>
      ${s.picked?`<div class="card" style="margin-top:12px;text-align:center">
          <div class="word" style="font-size:26px">${esc(w.word)}${sayBtn(w.word,w.audio)}</div>
          ${s.heard?`<p class="dim" style="margin-top:8px">heard: “${esc(s.heard)}”</p>`:''}
          <p class="muted" style="margin-top:6px">${s.picked==='ok'?'That’s it — nicely said.':'Not quite. Tap ▸ to hear it.'}</p>
          <button class="btn wide" style="margin-top:12px" onclick="nextQ()">Next →</button></div>`
      :`<button class="btn wide" style="margin-top:12px" onclick="listen()" ${s.listening?'disabled':''}>
          ${s.listening?'Listening…':'🎙 Tap and say it'}</button>
        ${s.micErr?`<p class="muted" style="text-align:center;margin-top:10px;font-size:13.5px">${esc(s.micErr)}</p>`:''}
        <p class="dim" style="text-align:center;margin-top:10px">Your voice never leaves the device</p>`}`;
  }

  // spelling
  return head+`<div class="card" style="text-align:center;padding:26px 18px">
      <span class="lbl">Hear it, then spell it</span>
      <div style="margin:14px 0"><button class="btn" onclick="say('${esc(w.word)}','${esc(w.audio||'')}')">▸ Play again</button></div>
      <p class="muted" style="font-size:14px">${nl(w.mine||w.meaning)}</p></div>
    <input id="sp" placeholder="Type what you heard" autocomplete="off" autocapitalize="off" spellcheck="false"
      style="margin-top:12px" onkeydown="if(event.key==='Enter')checkSpell()">
    ${s.picked?`<div class="card" style="margin-top:12px;text-align:center">
      <div class="word" style="font-size:24px">${esc(w.word)}</div>
      <p class="muted" style="margin-top:6px">${s.picked==='ok'?'Exactly right.':'Not quite — that\'s the spelling.'}</p>
      <button class="btn wide" style="margin-top:12px" onclick="nextQ()">Next →</button></div>`
    :`<button class="btn wide" style="margin-top:10px" onclick="checkSpell()">Check</button>`}`;
}
function flip(){if(sess){sess.flip=true;render()}}
function answer(q){const w=sess.queue.shift(); grade(w,q);
  if(q<3) sess.queue.push(w); else sess.done++;
  sess.flip=false; render();}
function pick(id){if(sess.picked)return; sess.picked=id;
  const w=sess.queue[0]; grade(w,id===w.id?4:0);
  if(id===w.id) sess.done++; render();}
function checkSpell(){
  const w=sess.queue[0], v=($('#sp')?.value||'').trim().toLowerCase();
  if(!v) return toast('Have a go first');
  const ok=v===w.word.trim().toLowerCase();
  sess.picked=ok?'ok':'no'; grade(w,ok?4:0); if(ok) sess.done++; render();
}
function nextQ(){sess.queue.shift(); sess.opts=null; sess.picked=null; sess.heard=''; sess.micErr=''; render();}

/* ── you ── */
function you(){
  const p=db.profile, n=db.books.length+db.words.length+db.quotes.length+db.notes.length;
  const days=Math.max(1,Math.ceil((Date.now()-p.at)/DAY));
  return `<div class="top"><div class="who"><div class="ava" style="width:52px;height:52px;border-radius:17px;font-size:21px">${esc(p.name[0].toUpperCase())}</div>
      <div><h2>${esc(p.name)}</h2><div class="dim">Reading here for ${days} day${days>1?'s':''}</div></div></div>
      <button class="iconb" onclick="toggleTheme()" aria-label="Light or dark">${document.documentElement.dataset.theme==='dark'?'☀':'☾'}</button></div>

    <div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center">
      ${[[p.streak||1,'day streak'],[db.words.length,'words'],[db.books.length,'books']]
        .map(([v,l])=>`<div><div style="font-size:25px;font-weight:800;letter-spacing:-.03em" class="grad">${v}</div>
        <div class="lbl" style="margin-top:2px">${l}</div></div>`).join('')}</div></div>

    <div class="card"><div class="row"><div><h3>Reminders</h3>
      <p class="muted" style="font-size:13.5px;margin-top:2px">${db.prefs.notify?'On — nudges when your words go stale.':'Off. Only ever about your own words — never anything else.'}</p></div>
      <button class="btn ghost sm" onclick="askNotify()">${db.prefs.notify?'Re-check':'Turn on'}</button></div></div>

    <div class="card"><h3>Your data</h3>
      <p class="muted" style="font-size:13.5px;margin-top:3px">${n} thing${n===1?'':'s'} saved, all of it on this device.${
        db.prefs.persisted?' The browser has agreed to keep it rather than evict it when space runs short.':''}
      A backup is still the only copy that survives a cleared browser or a new phone.</p>
      <button class="btn wide" style="margin-top:13px" onclick="exportBackup()">Download a backup</button>
      <div class="two" style="margin-top:9px">
        <button class="btn ghost sm" onclick="exportMarkdown()">Markdown</button>
        <button class="btn ghost sm" onclick="exportAnki()">Anki deck</button></div>
      <div class="field" style="margin-top:16px"><span class="lbl">Restore from a backup</span>
        <input id="imp" type="file" accept=".json,application/json" onchange="importBackup(this)">
        <div class="dim" style="margin-top:6px;letter-spacing:0;font-size:12px">Adds anything missing. Nothing already here is changed.</div></div></div>

    <div class="card"><div class="row"><div><h3>Name</h3>
      <p class="muted" style="font-size:13.5px;margin-top:2px">${esc(p.name)}</p></div>
      <button class="btn ghost sm" onclick="sheetName()">Change</button></div></div>

    <p class="dim" style="text-align:center;margin:22px 0 6px;letter-spacing:0;font-size:12px;line-height:1.6">
      LingoBox keeps everything on this device.<br>No account, no tracking, nothing sent anywhere.</p>`;
}

/* ══ sheets ═══════════════════════════════════════════════════════*/
function sheet(title,html,onSave,label){
  closeSheet();
  const s=document.createElement('div');
  s.innerHTML=`<div class="scrim" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div><h2 style="margin-bottom:16px">${title}</h2>${html}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" style="flex:1" onclick="closeSheet()">Cancel</button>
        <button class="btn" style="flex:2" id="ok">${label||'Save'}</button></div></div>`;
  s.id='sh'; document.body.appendChild(s);
  $('#ok').onclick=()=>{if(onSave()!==false){closeSheet();render()}};
  setTimeout(()=>s.querySelector('input,textarea')?.focus(),90);
}
function closeSheet(){document.getElementById('sh')?.remove(); draft=null; draftCover=''; applyWorld();}
const val=id=>($('#'+id)?.value||'').trim();

function genrePicker(sel){
  return `<div class="gens" id="gp">${GENRES.map(g=>`
    <button type="button" class="gen ${g.id===sel?'on':''}" onclick="pickGenre('${g.id}')">
      <i style="background:linear-gradient(135deg,${g.a},${g.b})"></i><span>${g.name}</span></button>`).join('')}</div>`;
}
function pickGenre(id){draft=id; applyWorld();
  const gp=$('#gp'); if(gp) gp.outerHTML=genrePicker(id);}

let draftCover='';
function sheetBook(){
  draft='literary'; draftCover='';
  sheet('Add a book',`
    <div class="field"><span class="lbl">Title</span>
      <div class="inline"><input id="t" placeholder="The Secret History" onkeydown="if(event.key==='Enter'){event.preventDefault();findBook()}">
      <button type="button" class="btn sm" onclick="findBook()">Find</button></div>
      <div id="fb"></div></div>
    <div class="field"><span class="lbl">Author</span><input id="a" placeholder="Donna Tartt"></div>
    <div class="two">
      <div class="field"><span class="lbl">On page</span><input id="p" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><span class="lbl">Total pages</span><input id="tp" type="number" inputmode="numeric" placeholder="optional"></div></div>
    <div class="field"><span class="lbl">What kind of book? The app dresses for it</span>${genrePicker('literary')}</div>`,
  ()=>{
    if(!val('t')) return toast('A title, at least'),false;
    const g=draft||'literary';
    db.books.unshift({id:uid(),title:val('t'),author:val('a'),page:+val('p')||0,pages:+val('tp')||0,
      genre:g,cover:draftCover||'',at:Date.now()});
    db.prefs.lastGenre=g; save();
  },'Add book');
}
function sheetGenre(){
  const b=book(openBook); draft=b.genre||'literary';
  sheet('The world of this book',
    `<p class="muted" style="margin-bottom:14px">Pick what it feels like. The colours and the weather behind the page both change — everywhere in the app, while you're in this book.</p>
     ${genrePicker(b.genre||'literary')}`,
  ()=>{b.genre=draft||'literary'; db.prefs.lastGenre=b.genre; save();},'Keep this world');
}
function sheetName(){
  sheet('Your name',`<div class="field"><span class="lbl">What should we call you?</span>
    <input id="nm2" value="${esc(db.profile.name)}" maxlength="40"></div>`,
  ()=>{const v=val('nm2'); if(!v) return toast('A name, or a nickname'),false; db.profile.name=v; save();});
}
function sheetPage(){
  const b=book(openBook);
  sheet('Move your bookmark',`<div class="two">
    <div class="field"><span class="lbl">Stopped at page</span><input id="p" type="number" inputmode="numeric" value="${b.page||''}"></div>
    <div class="field"><span class="lbl">Total pages</span><input id="tp" type="number" inputmode="numeric" value="${b.pages||''}"></div></div>`,
  ()=>{b.page=+val('p')||0; b.pages=+val('tp')||0; save();});
}
function sheetEntry(){
  const b=book(openBook);
  const pg=`<div class="field"><span class="lbl">Page</span><input id="p" type="number" inputmode="numeric" value="${b.page||''}"></div>`;
  if(bookTab==='words'){
    sheet('A new word',`
      <div class="field"><span class="lbl">Word</span>
        <div class="inline"><input id="w" placeholder="susurrus" onkeydown="if(event.key==='Enter'){event.preventDefault();doLookup()}">
        <button type="button" class="btn sm" onclick="doLookup()">Look up</button></div>
        <input id="ph" type="hidden"><input id="au" type="hidden"><div id="lk"></div></div>
      <div class="field"><span class="lbl">What the dictionary says</span>
        <textarea id="m" placeholder="Look it up above, or type it here." style="min-height:64px"></textarea></div>
      <div class="field"><span class="lbl">In your own words — the one you'll remember</span>
        <textarea id="mine" placeholder="Like wind through paper. The sound the library makes." style="min-height:64px"></textarea></div>
      <div class="field"><span class="lbl">The sentence you found it in · optional</span>
        <textarea id="c" placeholder="A susurrus of leaves overhead…" style="min-height:54px"></textarea></div>${pg}`,
    ()=>{
      if(!val('w')) return toast('Type the word'),false;
      if(!val('m')&&!val('mine')) return toast('Give it a meaning — theirs or yours'),false;
      db.words.unshift({id:uid(),bookId:b.id,word:val('w'),phonetic:val('ph'),audio:val('au'),
        meaning:val('m')||'—',mine:val('mine'),context:val('c'),page:+val('p')||0,at:Date.now(),srs:fresh()});
      save(); toast('Added to your dictionary');
    },'Keep this word');
  }else if(bookTab==='quotes'){
    sheet('A line worth keeping',`<div class="field"><span class="lbl">The line</span>
      <textarea id="q" placeholder="Beauty is terror. Whatever we call beautiful, we quiver before it."></textarea></div>${pg}`,
    ()=>{if(!val('q'))return toast('Nothing to keep yet'),false;
      db.quotes.unshift({id:uid(),bookId:b.id,text:val('q'),page:+val('p')||0,at:Date.now()}); save();},'Keep it');
  }else{
    sheet('What you saw',`<div class="field"><span class="lbl">Your entry</span>
      <textarea id="n" placeholder="The house was colder than they wrote it. I keep picturing the hallway in green…" style="min-height:130px"></textarea></div>${pg}`,
    ()=>{if(!val('n'))return toast('Write something first'),false;
      db.notes.unshift({id:uid(),bookId:b.id,text:val('n'),page:+val('p')||0,at:Date.now()}); save();},'Save entry');
  }
}

/* ══ actions ══════════════════════════════════════════════════════*/
function setTab(t){bookTab=t;render()}
function drop(kind,id){if(!confirm('Remove this? It won\'t come back.'))return;
  db[kind]=db[kind].filter(x=>x.id!==id); save(); render();}
function dropBook(id){const b=book(id);
  if(!confirm(`Delete "${b.title}" and everything saved inside it?`))return;
  db.books=db.books.filter(x=>x.id!==id);
  ['words','quotes','notes'].forEach(k=>db[k]=db[k].filter(x=>x.bookId!==id));
  save(); view='home'; openBook=null; render();}
function toggleTheme(){const d=document.documentElement.dataset.theme==='dark';
  db.prefs.theme=d?'light':'dark'; document.documentElement.dataset.theme=db.prefs.theme; save(); render();}
function go(v){view=v; sess=null; if(v!=='book') openBook=null; render();}

document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');
  if(s){e.stopPropagation();e.preventDefault();say(s.dataset.say,s.dataset.audio);}
},true);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-book]');
  if(!t) return;
  if(t.dataset.book){openBook=t.dataset.book;bookTab='words';view='book';
    db.prefs.lastGenre=book(openBook).genre||'literary'; save(); render();}
  else go(t.dataset.go);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if(view==='practice'&&sess?.kind==='cards'&&sess.queue.length&&!document.getElementById('sh')){
    if(e.key===' '){e.preventDefault();flip()}
    if(sess.flip&&'123'.includes(e.key)) answer([0,4,5][+e.key-1]);
  }
});

if(db.prefs?.theme) document.documentElement.dataset.theme=db.prefs.theme;
sizeSky(); touchStreak(); render(); askPersist();
if(!calm) raf=requestAnimationFrame(tick);
setTimeout(maybeNotify,2500);
</script>
</body>
</html>
