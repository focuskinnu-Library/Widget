/* Bodoni Moda, served from beside the app — no Google request, no third
   party, and it works with the network off like everything else here.
   Variable: weight 400–700, optical size 6–96, so the hairlines thicken
   on their own at small sizes instead of vanishing.
   SIL Open Font License 1.1 — see fonts/OFL.txt. */
@font-face{
  font-family:'Bodoni Moda';font-style:normal;font-weight:400 700;
  font-display:swap;src:url(fonts/bodoni-moda-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
    U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,
    U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Bodoni Moda';font-style:italic;font-weight:400 700;
  font-display:swap;src:url(fonts/bodoni-moda-latin-italic.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
    U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,
    U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
</style>
<style>
/* ══ LINGOBOX 4.0 — “BODONI · PARMA, 1791” ═════════════════════════
   Giambattista Bodoni cut his types for the Duke of Parma and printed
   the Manuale Tipografico: hairline serifs against stems four times
   their weight, acres of white, letterspaced capitals, and a rule so
   thin it is nearly a scratch. Nothing was rounded. Nothing glowed.

   So: real white, not cream — real black, not brown. One accent, the
   rosso pompeiano the Manuale used for its initials. Every corner
   square. Every shadow a crisp offset, never a halo. The drama is the
   type scale: 9px letterspaced capitals beside 44px Didone, and the
   gap between them left empty on purpose.

   The genre worlds survive, re-cut as flat historical pigments — the
   weather still falls behind the page, but the page itself stays
   white and black and keeps its one red.
------------------------------------------------------------------*/
:root{
  --g1:var(--g1l); --g2:var(--g2l);
  --g1l:#3f3b70; --g1d:#9b96c9; --g2l:#5a5590; --g2d:#b6b1dd;
  --rosso:#9E1B1B;
  --due:var(--rosso);
}
/* flat pigments a colourman of 1791 could actually grind */
[data-genre=romance] {--g1l:#8d2340;--g1d:#e39aae;--g2l:#a93c57;--g2d:#f0b8c6}
[data-genre=fantasy] {--g1l:#4a2d6b;--g1d:#bda4dd;--g2l:#7a5518;--g2d:#e0bd7a}
[data-genre=thriller]{--g1l:#6f1b16;--g1d:#e49b94;--g2l:#3c4450;--g2d:#a8b1bd}
[data-genre=literary]{--g1l:#6b541c;--g1d:#dcc189;--g2l:#7d4a16;--g2d:#e3b584}
[data-genre=scifi]   {--g1l:#17525f;--g1d:#8fc7d2;--g2l:#2f3570;--g2d:#a4a8d9}
[data-genre=nature]  {--g1l:#1f4d2e;--g1d:#9bc9a8;--g2l:#45631c;--g2d:#bcd292}
[data-genre=horror]  {--g1l:#34343a;--g1d:#a9a9b0;--g2l:#6f1b16;--g2d:#e09a93}
[data-genre=poetry]  {--g1l:#4c1c52;--g1d:#cfa2d4;--g2l:#15544f;--g2d:#93c8c2}

:root{
  /* paper, then card: two tones, four points apart. Enough that a card sits
     ON the page instead of dissolving into it, nowhere near cream. */
  --bg:#F5F4F1; --surf:#FFFFFF; --surf2:#EDEBE7;
  --ink:#0A0A0A; --ink2:#36352F; --ink3:#6B6A66;
  --line:rgba(10,10,10,.26); --line2:rgba(10,10,10,.11);
  --on-g:#FFFFFF;
  /* a printed sheet casts an edge, not a glow */
  --shadow:1px 1px 0 rgba(10,10,10,.05);
  --soft:color-mix(in srgb,var(--g1) 7%,var(--surf));
  --bg-tint:var(--bg);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  /* Didone first: Apple ships Didot and Bodoni 72, so most phones get
     the real thing with nothing to download. Bodoni Moda is the
     webfont fallback for everyone else. */
  --display:'Bodoni Moda','Bodoni 72',Didot,'Didot LT STD','Bodoni MT',
            'Playfair Display','Times New Roman',Georgia,serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  /* Bodoni did not round a corner in his life */
  --r:0px; --r2:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0A0A0B; --surf:#141416; --surf2:#1C1C1F;
  --ink:#F7F6F3; --ink2:#B6B4AE; --ink3:#7E7C77;
  --line:rgba(247,246,243,.26); --line2:rgba(247,246,243,.11);
  --on-g:#FFFFFF; --shadow:1px 1px 0 rgba(0,0,0,.5);
  --g1:var(--g1d); --g2:var(--g2d);
  --rosso:#D9483F; --due:var(--rosso);
  --soft:color-mix(in srgb,var(--g1) 13%,var(--surf));
  --bg-tint:var(--bg);
}}
:root[data-theme=dark]{
  --bg:#0A0A0B; --surf:#141416; --surf2:#1C1C1F;
  --ink:#F7F6F3; --ink2:#B6B4AE; --ink3:#7E7C77;
  --line:rgba(247,246,243,.26); --line2:rgba(247,246,243,.11);
  --on-g:#FFFFFF; --shadow:1px 1px 0 rgba(0,0,0,.5);
  --g1:var(--g1d); --g2:var(--g2d);
  --rosso:#D9483F; --due:var(--rosso);
  --soft:color-mix(in srgb,var(--g1) 13%,var(--surf));
  --bg-tint:var(--bg);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 15.5px/1.6 var(--serif);
  min-height:100dvh; overflow-x:hidden;
}
#sky{position:fixed;inset:0;z-index:0;opacity:.45}
#app{position:relative;z-index:2;max-width:536px;margin:0 auto;
  padding:22px 24px calc(92px + env(safe-area-inset-bottom))}
::selection{background:var(--rosso);color:#fff}
:focus-visible{outline:1.5px solid var(--rosso);outline-offset:2px;border-radius:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}

/* ── the parts a printer sets ─────────────────────────────────── */
.lbl{font:650 9px/1.5 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--ink3)}
.folio{font:500 9px/1.7 var(--mono);letter-spacing:.14em;color:var(--ink3)}
.dim{font:500 11px/1.6 var(--mono);letter-spacing:.05em;color:var(--ink3)}
.muted{color:var(--ink2);font-size:14px;line-height:1.65}
.serif{font-family:var(--serif)}
.dim.serif{font-family:var(--serif)}
.grad{color:var(--rosso)}
mark{background:color-mix(in srgb,var(--rosso) 14%,transparent);color:inherit;padding:0 2px}

/* every display line is Bodoni: hairline serifs, tight fit, no shadow */
h1,h2,h3,.hero h1,.flash .w,.word,.toc .tt,.exlibris .nm,.daycard .big,
.recp b,.dropcap,.empty h3,.sheet h2,.nowread b,.quote,.mine,.ava{
  font-family:var(--display);
  font-variant-numeric:lining-nums;
}

/* masthead: a frontispiece, centred, under a double rule */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:4px}
.mark{font:400 15px var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
.mark em{font-style:italic;color:var(--rosso);letter-spacing:.14em}
.chapt{font:600 9px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);
  border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:5px 0;background:none}
.iconb{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:0;color:var(--ink2);font:500 13px var(--mono);background:var(--surf);transition:.15s}
.iconb:hover{border-color:var(--rosso);color:var(--rosso)}

/* No ghost numeral. A Didone numeral set that large is a bare slab —
   chapter I came out as a grey bar that read as a fault — and the
   Manuale never set one. The chapter is named in small caps instead. */
.chap{position:relative}

/* the double rule — Bodoni's one piece of punctuation at the page level */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin:36px 0 14px;padding-top:10px;border-top:1px solid var(--ink);position:relative}
.sec::before{content:'';position:absolute;top:3px;left:0;right:0;border-top:1px solid var(--ink);
  opacity:.34}
.sec .link{flex:none}

/* cards: a square of white stock, one hairline, no float */
.card{background:var(--surf);border:1px solid var(--line);border-radius:0;
  padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:650 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  border:1px solid var(--line);padding:4px 8px;border-radius:0;background:transparent;white-space:nowrap}
.chip.flat{border-color:transparent;color:var(--ink3)}
.link{font:650 9px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--rosso);
  padding:2px 0;border-bottom:1px solid transparent;transition:.15s}
.link:hover{border-bottom-color:var(--rosso)}

/* buttons: set in metal, squared off */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:0;
  font:650 9.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;
  padding:14px 18px;transition:background .12s,color .12s,opacity .12s}
.btn:hover{background:var(--rosso);border-color:var(--rosso);color:#fff;opacity:1}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:transparent;border-color:var(--rosso);color:var(--rosso)}
.btn.sm{padding:10px 13px;font-size:9px}
.btn.wide{width:100%}

/* forms: entries ruled into a register */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}
.inline{display:flex;gap:8px;align-items:flex-end}
input,textarea,select{
  background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
  font:400 16px/1.5 var(--serif);color:var(--ink);padding:9px 2px;width:100%;outline:none;
  transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--ink3);font-style:italic}
input:focus,textarea:focus{border-bottom-color:var(--rosso)}
textarea{resize:vertical;min-height:60px}
input[type=file]{font:500 11px var(--mono);padding:10px 0;border-bottom:1px solid var(--line)}
input[type=number]{-moz-appearance:textfield}

/* ── type that moves, once, quietly ────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .5s both}
.rise>*:nth-child(1){animation-delay:.03s}.rise>*:nth-child(2){animation-delay:.09s}
.rise>*:nth-child(3){animation-delay:.15s}.rise>*:nth-child(4){animation-delay:.21s}
.rise>*:nth-child(5){animation-delay:.27s}.rise>*:nth-child(6){animation-delay:.33s}
.rise>*:nth-child(7){animation-delay:.39s}.rise>*:nth-child(8){animation-delay:.45s}
.fade{animation:rise .35s both}
@keyframes sheetup{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ── the platen: bottom navigation ─────────────────────────────── */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
#nav::before{content:'';display:block;height:3px;margin-top:-4px;border-top:1px solid var(--line);
  opacity:.5}
.navin{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 4px 13px;font:650 8px var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3);transition:color .15s}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.1;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--rosso)}
.tab.on::after{content:'';position:absolute;top:-1px;left:24%;right:24%;height:2px;background:var(--rosso)}
.pip{position:absolute;top:4px;left:calc(50% + 2px);background:var(--rosso);color:#fff;
  font:700 8px var(--mono);padding:1px 4px;border-radius:0}

/* ── the shelf ─────────────────────────────────────────────────── */
.shelfwrap{margin-top:6px}
.shelf{display:flex;gap:9px;overflow-x:auto;padding:18px 2px 12px;scrollbar-width:none;
  align-items:flex-end}
.shelf::-webkit-scrollbar{display:none}
.spine{flex:none;width:56px;border-radius:0;position:relative;cursor:pointer;
  background:var(--g1);color:var(--on-g);
  display:flex;align-items:flex-end;justify-content:center;padding:14px 0 12px;
  box-shadow:1px 0 0 rgba(10,10,10,.3), inset -2px 0 0 rgba(255,255,255,.10);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2)}
.spine:hover{transform:translateY(-7px)}
.spine:active{transform:translateY(-2px)}
.spine .t{padding-right:11px;padding-bottom:31px;writing-mode:vertical-rl;
  font:400 12.5px/1.2 var(--display);letter-spacing:.06em;max-height:132px;overflow:hidden}
.spine .sig{position:absolute;top:9px;left:0;right:0;text-align:center;
  font:650 7px var(--mono);letter-spacing:.18em;opacity:.7}
.spine.reading::before{content:'';position:absolute;top:0;left:10px;right:10px;height:2px;
  background:rgba(255,255,255,.85)}
.spine.add{background:transparent!important;color:var(--ink3);border:1px dashed var(--line);
  box-shadow:none;display:flex;align-items:center;justify-content:center;height:126px}
.spine.add:hover{color:var(--rosso);border-color:var(--rosso)}
.spine.add .t{font:650 9px var(--mono);letter-spacing:.2em;text-transform:uppercase}
/* gilt rules stamped across the spine, the way a Parma binding carries them */
.spine::after{content:'';position:absolute;left:5px;right:5px;top:22px;height:0;
  border-top:1px solid rgba(255,255,255,.34);
  box-shadow:0 3px 0 -2px rgba(255,255,255,.34)}
/* the paste-on label every circulating copy carries */
.spine .label{position:absolute;left:6px;right:6px;bottom:6px;padding:3px 0 4px;border-radius:0;
  background:#FFFFFF;color:#0A0A0A;font:600 6.5px/1.35 var(--mono);letter-spacing:.07em;
  text-align:center;box-shadow:none;text-shadow:none;border-top:1px solid var(--rosso)}
.spine .label b{display:block;font-weight:800;font-size:7px}
.spine .a{writing-mode:vertical-rl;font:500 8px/1 var(--mono);letter-spacing:.08em;opacity:.72;
  position:absolute;top:30px;bottom:42px;right:5px;width:10px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.facing{flex:none;width:98px;border-radius:0;position:relative;cursor:pointer;
  background:none;padding:0;align-self:flex-end;transition:transform .18s}
.facing:hover{transform:translateY(-7px)}
.facing .jacket{display:block;position:relative;width:100%;aspect-ratio:2/3;border-radius:0;
  overflow:hidden;background:var(--g1);
  box-shadow:3px 3px 0 rgba(10,10,10,.14),inset 3px 0 0 rgba(0,0,0,.22)}
.facing img{width:100%;height:100%;object-fit:cover;display:block}
.facing .blurb{position:absolute;inset:0;padding:14px 11px 42px;display:flex;flex-direction:column;
  justify-content:space-between;color:var(--on-g);text-align:left}
.facing .blurb b{font:400 14px/1.22 var(--display);display:-webkit-box;-webkit-line-clamp:4;
  -webkit-box-orient:vertical;overflow:hidden;letter-spacing:.01em}
.facing .blurb i{font-style:italic;font-size:9px;opacity:.85;letter-spacing:.06em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.facing .label{position:absolute;left:8px;bottom:12px;padding:3px 7px 4px;border-radius:0;
  background:#FFFFFF;color:#0A0A0A;font:600 6.5px/1.35 var(--mono);letter-spacing:.07em;
  text-align:center;box-shadow:none;text-shadow:none;border-top:1px solid var(--rosso)}
.facing .label b{display:block;font-weight:800;font-size:7px}
.facing .pct{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.34)}
.facing .pct i{display:block;height:100%;background:#fff;opacity:.95}
.nowread{margin-top:14px;padding-left:12px;border-left:1px solid var(--rosso)}
.nowread b{display:block;font:400 19px/1.25 var(--display);letter-spacing:.005em}
.nowread i{display:block;font-style:italic;font-size:13px;color:var(--ink2);margin-top:2px}
.nowread .folio{display:block;margin-top:5px}
/* the shelf board: one firm rule, one faint — a double rule again */
.ledge{height:0;border-top:1px solid var(--ink);margin:0 2px;position:relative;
  box-shadow:0 3px 0 -2px var(--line)}
.ledge::after{content:'';position:absolute;top:3px;left:0;right:0;border-top:0}

.chip.lv{font-size:9px}
.chip.lv.new{background:transparent;color:var(--ink3);border-color:var(--line2)}
.chip.lv.learn{background:transparent;color:var(--ink2);border-color:var(--ink3)}
.chip.lv.known{background:transparent;color:var(--ink);border-color:var(--ink2)}
.chip.lv.master{background:var(--rosso);color:#fff;border-color:var(--rosso)}
.lvbar{display:flex;height:6px;border-radius:0;overflow:hidden;background:var(--line2);margin-top:13px}
.lvbar i{display:block;height:100%}
.lvkey{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px}
.lvkey span{font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink2);
  display:flex;align-items:center;gap:6px}
.lvkey b{width:8px;height:8px;border-radius:0;display:block}

/* the errata slip: words due */
.errata{position:relative;background:var(--surf);
  border:1px solid var(--ink);border-radius:0;padding:17px 18px;text-align:left;width:100%;
  box-shadow:var(--shadow);transform:none}
.errata::before{content:'';position:absolute;inset:4px;border:1px solid var(--line2);
  pointer-events:none;border-radius:0}
.errata:hover{border-color:var(--rosso)}
.stamp{font:700 8px var(--mono);letter-spacing:.28em;color:var(--rosso);
  border:1px solid var(--rosso);padding:3px 8px;border-radius:0;display:inline-block;
  transform:rotate(-2deg)}

/* marginalia */
.margin-note{position:relative;padding-left:14px;text-align:left;transform:none}
.margin-note::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:1px;
  background:var(--rosso);opacity:.7}

/* word of the day: the front matter */
.daycard{cursor:pointer;text-align:left;width:100%}
.daycard .big{font:400 34px/1.1 var(--display);letter-spacing:-.005em}
.daycard:hover .big{color:var(--rosso)}

/* leader dots, the way a contents page points */
.lead{display:flex;align-items:baseline;gap:9px;min-width:0}
.lead .dots{flex:1;border-bottom:1px dotted var(--ink3);opacity:.6;
  transform:translateY(-3px);min-width:14px}

/* ── a book, opened ────────────────────────────────────────────── */
/* the half-title: flat ink, white type, the genre only as a rule */
.hero{background:var(--ink);color:#fff;
  border-radius:0;padding:26px 24px 24px;position:relative;overflow:hidden;
  box-shadow:3px 3px 0 var(--line2)}
.hero::after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.22);
  border-radius:0;pointer-events:none}
.hero h1{font:400 32px/1.1 var(--display);letter-spacing:-.01em}
.hero .sub{font:500 9px var(--mono);letter-spacing:.26em;text-transform:uppercase;opacity:.78;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--g1)}
.hero .lbl{color:inherit;opacity:.6}
.cov{width:54px;border-radius:0;box-shadow:3px 3px 0 rgba(0,0,0,.26)}
.cov.sm{width:32px}
.cov.hero{width:76px}
.cov.ph{display:block;height:46px;background:var(--line2)}
.bar{height:1px;background:rgba(255,255,255,.3);border-radius:0;overflow:visible;margin-top:16px}
.bar i{display:block;height:3px;margin-top:-1px;background:var(--g1)}
.prog{height:1px;background:var(--line2);margin:8px 0 2px;overflow:visible}
.prog i{display:block;height:3px;margin-top:-1px;background:var(--rosso);transition:width .3s}

/* thumb index */
.seg{display:flex;gap:0;margin-top:24px;border-bottom:1px solid var(--ink)}
.seg button{flex:1;padding:12px 6px;font:650 8.5px var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);border-top:2px solid transparent;
  border-bottom:1px solid var(--ink);margin-bottom:-1px;transition:.15s;white-space:nowrap}
.seg button.on{color:var(--ink);border-top-color:var(--rosso);border-bottom-color:var(--surf);
  background:var(--surf)}
.seg button:hover{color:var(--ink)}

/* plate: the fingerprint figure */
.plate{border:1px solid var(--line);border-radius:0;background:var(--surf);
  padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.plate svg{width:76px;height:76px;flex:none;border:1px solid var(--line2);border-radius:0;
  background:var(--surf2)}
.plate .grow{min-width:0;flex:1}
.plate h3{font:italic 400 17px/1.25 var(--display)}
.plate{align-items:flex-start}
.plate svg{width:64px;height:64px}
@media (max-width:420px){
  .plate{flex-wrap:wrap;gap:12px}
  .plate .grow{flex:1 1 150px}
}
.ticks{position:relative}
.ticks::before,.ticks::after{content:'';position:absolute;width:8px;height:8px;pointer-events:none}
.ticks::before{top:-1px;left:-1px;border-top:1px solid var(--rosso);border-left:1px solid var(--rosso)}
.ticks::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--rosso);border-right:1px solid var(--rosso)}

/* entries, typeset */
.entry{padding:17px 0;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:none}
.word{font:400 19.5px var(--display);letter-spacing:0}
.pron{font:500 9.5px var(--mono);color:var(--ink3);letter-spacing:.04em}
.say{width:22px;height:22px;flex:none;display:inline-grid;place-items:center;margin-left:5px;
  border:1px solid var(--line);border-radius:50%;font:500 8px var(--mono);color:var(--ink2);
  vertical-align:middle;transition:.15s}
.say:hover{border-color:var(--rosso);color:var(--rosso)}
.mine{border-left:1px solid var(--rosso);padding:5px 0 5px 13px;margin-top:10px;
  font:italic 400 16px/1.6 var(--display)}
.quote{font:italic 400 20px/1.55 var(--display)}
.del{font:650 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1px dotted var(--ink3);padding:1px 0;transition:.15s}
.del:hover{color:var(--rosso);border-color:var(--rosso)}
.pos{font:650 8.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--rosso)}

/* the concordance */
.cgroup{margin-top:24px}
/* the Manuale's initials were red, and set far larger than anyone needed.
   Set clear of the cards rather than floated into them — floated, the
   next card's background painted straight over it. */
.dropcap{display:flex;align-items:center;gap:14px;
  font:400 44px/1 var(--display);color:var(--rosso);margin:0 0 12px}
.dropcap::after{content:'';flex:1;border-top:1px solid var(--line2)}
.cline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:12px 0;
  border-bottom:1px solid var(--line2)}
.duechip{font:650 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  color:var(--ink3);border:1px solid var(--line2);padding:3px 6px;border-radius:0}
.duechip.now{color:var(--rosso);border-color:var(--rosso)}

/* practice: a contents page */
.toc{width:100%;text-align:left;display:flex;align-items:baseline;gap:14px;
  padding:18px 2px;border-bottom:1px solid var(--line2);transition:.15s}
.toc .n{font:500 10px var(--mono);letter-spacing:.1em;color:var(--ink3);width:28px;flex:none}
.toc .tt{font:400 22px var(--display);letter-spacing:-.005em;transition:.15s;white-space:nowrap}
.toc .meta{font:650 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);white-space:nowrap}
.toc:hover .tt{color:var(--rosso)}
.toc:hover .n{color:var(--rosso)}
.flash{background:var(--surf);border:1px solid var(--ink);border-top:2px solid var(--rosso);
  border-radius:0;min-height:304px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:32px 26px;cursor:pointer;box-shadow:var(--shadow)}
.flash .w{font:400 46px/1.05 var(--display);letter-spacing:-.015em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;
  border:1px solid var(--line)}
.rate button{padding:15px 6px;border:0;border-left:1px solid var(--line);border-radius:0;
  background:var(--surf);font:400 15px var(--display);transition:.15s}
.rate button:first-child{border-left:0}
.rate button b{display:block;font:500 8px var(--mono);letter-spacing:.14em;color:var(--ink3);
  margin-top:5px;text-transform:uppercase}
.rate button:hover{background:var(--rosso);color:#fff}
.rate button:hover b{color:rgba(255,255,255,.75)}
.opt{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  background:var(--surf);border:1px solid var(--line);border-radius:0;
  padding:15px 16px;margin-top:8px;transition:.15s}
.opt:hover{border-color:var(--ink)}
.opt .abc{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);flex:none}
.opt.right{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.wrong{border-color:var(--rosso);box-shadow:inset 3px 0 0 var(--rosso)}

/* empty states */
.empty{text-align:center;padding:48px 20px;border:1px solid var(--line2);border-radius:0;
  margin-top:16px;background:var(--surf)}
.empty h3{font:italic 400 23px var(--display)}
.empty p{margin:9px auto 0;max-width:30ch;color:var(--ink2);font-size:14px;line-height:1.7}
.em{width:42px;height:42px;margin:0 auto 14px;border:1px solid var(--line);border-radius:0;
  display:grid;place-items:center;color:var(--rosso);background:var(--surf)}
.em svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.1;
  stroke-linecap:round;stroke-linejoin:round}

/* the colophon table + the pressman's calendar */
.recp{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:0;overflow:hidden;margin-top:15px}
.recp>div{background:var(--surf);padding:15px 8px;text-align:center}
.recp b{display:block;font:400 26px/1.05 var(--display);color:var(--ink);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recp span{display:block;font:650 7.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3);margin-top:6px}
.hmwrap{display:flex;gap:10px;align-items:flex-start}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;
  overflow-x:auto;padding-bottom:3px;flex:1;scrollbar-width:none}
.hm::-webkit-scrollbar{display:none}
.hm i{width:11px;height:11px;border-radius:0;background:var(--line2);min-width:11px}
.hm i.l1{background:color-mix(in srgb,var(--rosso) 28%,var(--surf2))}
.hm i.l2{background:color-mix(in srgb,var(--rosso) 58%,var(--surf2))}
.hm i.l3{background:var(--rosso)}
.hmside{display:grid;grid-template-rows:repeat(7,11px);gap:3px;flex:none}
.hmside span{font:500 8px var(--mono);color:var(--ink3);line-height:11px}

/* avatar → a printer's initial, squared */
.ava{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--ink);
  border-radius:0;font:400 22px var(--display);color:var(--ink);background:var(--surf)}
.who{display:flex;align-items:center;gap:13px;min-width:0}

/* toast, pill */
.toast{position:fixed;bottom:106px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:12px 20px;border-radius:0;font:600 11px var(--mono);
  letter-spacing:.1em;z-index:60;animation:rise .25s;white-space:normal;max-width:min(86vw,420px);
  text-align:center;box-shadow:2px 2px 0 rgba(10,10,10,.18)}
.toast button{margin-left:12px;background:none;border:none;color:inherit;font:inherit;font-weight:800;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#netpill{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:70;
  transform:translate(-50%,-70px);transition:transform .4s cubic-bezier(.2,.9,.25,1.15);
  background:var(--ink);color:var(--bg);padding:8px 15px;border-radius:0;
  font:650 9px var(--mono);letter-spacing:.18em;text-transform:uppercase;
  pointer-events:none;white-space:nowrap}
#netpill.on{transform:translate(-50%,0)}

/* sheets: tipped-in plates */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 52%,transparent);z-index:54}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:55;
  width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--surf);
  border:1px solid var(--ink);border-bottom:none;border-radius:0;
  padding:10px 24px 28px;animation:sheetup .3s cubic-bezier(.2,.9,.3,1.05)}
.sheet h2{font:italic 400 26px var(--display);letter-spacing:-.005em}
.grab{width:34px;height:1px;background:var(--ink);border-radius:0;margin:8px auto 18px}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.gen{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 6px;
  border:0;border-radius:0;background:var(--surf);
  font:650 8.5px var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink2);transition:.15s}
.gen i{width:100%;height:20px;border-radius:0;display:block}
.gen:hover{color:var(--ink)}
.gen.on{background:var(--ink);color:#fff}

/* lookup panel + hear links */
.lk{margin-top:10px;border:1px solid var(--line);border-radius:0;overflow:hidden}
.lkh{padding:11px 14px;background:var(--surf2);display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.sense{display:block;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line2)}
.sense:hover{background:var(--surf2)}
.sense p{font-size:14.5px;line-height:1.55;margin-top:4px;font-family:var(--serif)}
.sense em{display:block;font:italic 400 13.5px/1.5 var(--display);color:var(--ink3);margin-top:5px}
.syn{padding:11px 14px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:5px}
.hear{display:flex;gap:0;flex-wrap:wrap;margin-top:10px}
.hear a{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:0;
  border:1px solid var(--line);margin:0 -1px -1px 0;font:650 8.5px var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink2);text-decoration:none;transition:.15s}
.hear a:hover{border-color:var(--rosso);color:var(--rosso);position:relative;z-index:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ══ the sheet in your hands ════════════════════════════════════════
   A reader of paper books is holding one already. This is the
   companion volume: a squared sheet with a real edge, wide margins,
   and a ribbon to keep the place. No grain, no foxing, no age — the
   Manuale was printed on paper so white it was remarked upon.
------------------------------------------------------------------*/
#app{
  /* no background of its own: the paper is the body, the weather falls on
     it, and the white cards sit on top. Painting a near-opaque sheet here
     flattened both the page tone and the weather out of existence. */
  background:transparent;
  border-left:1px solid var(--line2); border-right:1px solid var(--line2);
  box-shadow:none;
  position:relative;
  min-height:100dvh;
}

/* ── the card catalogue ──────────────────────────────────────────
   Still the drawer of 3×5s, still the ruled heading and the rod hole
   punched through the foot — but cut from white stock, and the
   heading rule is the one red on the page.
----------------------------------------------------------------- */
.catcard{position:relative;background:var(--surf);
  border:1px solid var(--line);border-radius:0;padding:28px 18px 32px 18px;margin-bottom:14px;
  box-shadow:2px 2px 0 var(--line2)}
.catcard::before{content:'';position:absolute;left:0;right:0;top:20px;
  border-top:1px solid var(--rosso);opacity:.75}
.catcard::after{content:'';position:absolute;left:50%;bottom:10px;width:10px;height:10px;
  margin-left:-5px;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 1px 1px rgba(10,10,10,.5)}
.catcard .callno{position:absolute;top:5px;left:18px;font:700 8px var(--mono);
  letter-spacing:.16em;color:var(--ink3)}
.catcard .folio{position:relative;z-index:1}

/* ── the date-due slip, pasted inside the front board ────────────── */
.dueslip{margin-top:14px;background:var(--surf);
  border:1px solid var(--line);border-radius:0;padding:13px 16px 16px;
  box-shadow:2px 2px 0 var(--line2)}
.dueslip h4{font:700 8px var(--mono);letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink3);text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dueslip .dates{display:flex;flex-wrap:wrap;gap:8px 10px;padding-top:12px}
.dueslip .dates i{font-style:normal;font:700 9.5px var(--mono);letter-spacing:.12em;
  color:var(--rosso);border:1px solid var(--rosso);border-radius:0;padding:3px 7px;
  opacity:.9;transform:rotate(var(--r,0deg))}
.dueslip .none{font:italic 400 14px var(--display);color:var(--ink3);padding-top:11px}

/* ── ex libris ───────────────────────────────────────────────────── */
.exlibris{position:relative;text-align:center;padding:34px 20px;margin-top:16px;
  background:var(--surf);border:1px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--line2)}
.exlibris::before{content:'';position:absolute;inset:6px;border:1px solid var(--line2);
  border-radius:0;pointer-events:none}
/* the double rule, in the one red */
.exlibris::after{content:'';position:absolute;inset:10px;border:3px double var(--rosso);
  border-radius:0;pointer-events:none;opacity:.8}
.exlibris .ex{font:700 8.5px var(--mono);letter-spacing:.42em;text-transform:uppercase;color:var(--ink3)}
.exlibris .nm{font:italic 400 36px/1.15 var(--display);letter-spacing:-.01em;margin-top:12px;
  color:var(--ink)}
.exlibris .orn2{font:400 15px var(--display);color:var(--rosso);margin:11px 0 9px;letter-spacing:.5em}
.exlibris .acc{font:500 8.5px var(--mono);letter-spacing:.2em;color:var(--ink3)}

/* a printer's ornament between movements */
.orn{display:flex;align-items:center;gap:14px;margin:30px 0 6px;color:var(--rosso)}
.orn::before,.orn::after{content:'';flex:1;border-top:1px solid var(--line2)}
.orn span{font:400 14px var(--display);letter-spacing:.4em;opacity:.9}
.orna{color:var(--rosso);font-family:var(--display);line-height:1}
.orna,.orn span,.exlibris .orn2{font-variant-emoji:text}

/* the ribbon that keeps your place */
#ribbon{position:fixed;top:0;right:3px;width:13px;z-index:3;display:none;
  cursor:pointer;border:0;padding:0;background:none;overflow:hidden}
#ribbon i{display:block;width:13px;height:64px;background:var(--rosso);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);
  box-shadow:1px 0 0 rgba(10,10,10,.2);transition:height .2s}
#ribbon:hover i{height:78px}


/* ══ the decorated papers ═══════════════════════════════════════════
   Bodoni set the text block; he did not bind the book. Italian volumes
   of the period were cased in carte decorate — the block-printed papers
   of the Remondini press near Venice, and marbled endpapers combed by
   hand. The motif is the ogee-and-pomegranate the Venetians took from
   Ottoman silks and never gave back.

   So the ornament goes where it historically goes: on the paper, the
   endpapers and the half-title. Never under running text — every card
   stays plain white stock, and the print shows in the margins and the
   gaps between them, which is exactly where a reader would see it.

   Each one is an SVG mask rather than a coloured image, so a single
   file serves light and dark and the ink stays a CSS token.
------------------------------------------------------------------*/
:root{ --print:rgba(10,10,10,.065); --marble:var(--rosso); }
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--print:rgba(247,246,243,.06)}}
:root[data-theme=dark]{--print:rgba(247,246,243,.06)}

/* the sheet the whole app is printed on */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--print);
  -webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><g fill='none' stroke='%23fff' stroke-width='1.25'><path d='M0 48C0 24 24 0 48 0C72 0 96 24 96 48C96 72 72 96 48 96C24 96 0 72 0 48Z'/></g><g fill='%23fff'><path d='M48 33C52.5 38 55 43 55 47.5C55 52.5 52 57 48 60.5C44 57 41 52.5 41 47.5C41 43 43.5 38 48 33Z'/><path d='M47.2 33.4C46.4 31 46.6 29 48 27.2C49.4 29 49.6 31 48.8 33.4Z'/><circle cx='48' cy='0' r='2.5'/><circle cx='48' cy='96' r='2.5'/><circle cx='0' cy='48' r='2.5'/><circle cx='96' cy='48' r='2.5'/></g><g fill='none' stroke='%23fff' stroke-width='1' stroke-linecap='round'><path d='M38 42C32 38 28 32 29 25'/><path d='M58 42C64 38 68 32 67 25'/><path d='M38 54C32 58 28 64 29 71'/><path d='M58 54C64 58 68 64 67 71'/><path d='M29 25C33 26 35 29 35 32'/><path d='M67 25C63 26 61 29 61 32'/><path d='M29 71C33 70 35 67 35 64'/><path d='M67 71C63 70 61 67 61 64'/></g></svg>"); mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><g fill='none' stroke='%23fff' stroke-width='1.25'><path d='M0 48C0 24 24 0 48 0C72 0 96 24 96 48C96 72 72 96 48 96C24 96 0 72 0 48Z'/></g><g fill='%23fff'><path d='M48 33C52.5 38 55 43 55 47.5C55 52.5 52 57 48 60.5C44 57 41 52.5 41 47.5C41 43 43.5 38 48 33Z'/><path d='M47.2 33.4C46.4 31 46.6 29 48 27.2C49.4 29 49.6 31 48.8 33.4Z'/><circle cx='48' cy='0' r='2.5'/><circle cx='48' cy='96' r='2.5'/><circle cx='0' cy='48' r='2.5'/><circle cx='96' cy='48' r='2.5'/></g><g fill='none' stroke='%23fff' stroke-width='1' stroke-linecap='round'><path d='M38 42C32 38 28 32 29 25'/><path d='M58 42C64 38 68 32 67 25'/><path d='M38 54C32 58 28 64 29 71'/><path d='M58 54C64 58 68 64 67 71'/><path d='M29 25C33 26 35 29 35 32'/><path d='M67 25C63 26 61 29 61 32'/><path d='M29 71C33 70 35 67 35 64'/><path d='M67 71C63 70 61 67 61 64'/></g></svg>");
  -webkit-mask-size:88px 88px; mask-size:88px 88px;
  -webkit-mask-repeat:repeat; mask-repeat:repeat;
}
/* the weather falls on the printed paper, not under it */
#sky{z-index:1}

/* the bookplate is an endpaper, so it gets marbled stock */
.exlibris{overflow:hidden}
.exlibris>*{position:relative;z-index:1}
.exlibris .marb{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--marble); opacity:.2;

  -webkit-mask-size:cover; mask-size:cover;
}

.hero{isolation:isolate}
.hero::before{

  background:var(--g1); opacity:.32;
  -webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><g fill='none' stroke='%23fff' stroke-width='1.4'><path d='M0 75C0 37 37 0 75 0C113 0 150 37 150 75C150 113 113 150 75 150C37 150 0 113 0 75Z'/><path d='M75 52C86 62 91 70 91 76C91 84 84 92 75 99C66 92 59 84 59 76C59 70 64 62 75 52Z'/></g></svg>"); mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><g fill='none' stroke='%23fff' stroke-width='1.4'><path d='M0 75C0 37 37 0 75 0C113 0 150 37 150 75C150 113 113 150 75 150C37 150 0 113 0 75Z'/><path d='M75 52C86 62 91 70 91 76C91 84 84 92 75 99C66 92 59 84 59 76C59 70 64 62 75 52Z'/></g></svg>");

}

  -webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><g fill='none' stroke='%23fff' stroke-width='1.25'><path d='M0 48C0 24 24 0 48 0C72 0 96 24 96 48C96 72 72 96 48 96C24 96 0 72 0 48Z'/></g><g fill='%23fff'><path d='M48 33C52.5 38 55 43 55 47.5C55 52.5 52 57 48 60.5C44 57 41 52.5 41 47.5C41 43 43.5 38 48 33Z'/><path d='M47.2 33.4C46.4 31 46.6 29 48 27.2C49.4 29 49.6 31 48.8 33.4Z'/><circle cx='48' cy='0' r='2.5'/><circle cx='48' cy='96' r='2.5'/><circle cx='0' cy='48' r='2.5'/><circle cx='96' cy='48' r='2.5'/></g><g fill='none' stroke='%23fff' stroke-width='1' stroke-linecap='round'><path d='M38 42C32 38 28 32 29 25'/><path d='M58 42C64 38 68 32 67 25'/><path d='M38 54C32 58 28 64 29 71'/><path d='M58 54C64 58 68 64 67 71'/><path d='M29 25C33 26 35 29 35 32'/><path d='M67 25C63 26 61 29 61 32'/><path d='M29 71C33 70 35 67 35 64'/><path d='M67 71C63 70 61 67 61 64'/></g></svg>"); mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><g fill='none' stroke='%23fff' stroke-width='1.25'><path d='M0 48C0 24 24 0 48 0C72 0 96 24 96 48C96 72 72 96 48 96C24 96 0 72 0 48Z'/></g><g fill='%23fff'><path d='M48 33C52.5 38 55 43 55 47.5C55 52.5 52 57 48 60.5C44 57 41 52.5 41 47.5C41 43 43.5 38 48 33Z'/><path d='M47.2 33.4C46.4 31 46.6 29 48 27.2C49.4 29 49.6 31 48.8 33.4Z'/><circle cx='48' cy='0' r='2.5'/><circle cx='48' cy='96' r='2.5'/><circle cx='0' cy='48' r='2.5'/><circle cx='96' cy='48' r='2.5'/></g><g fill='none' stroke='%23fff' stroke-width='1' stroke-linecap='round'><path d='M38 42C32 38 28 32 29 25'/><path d='M58 42C64 38 68 32 67 25'/><path d='M38 54C32 58 28 64 29 71'/><path d='M58 54C64 58 68 64 67 71'/><path d='M29 25C33 26 35 29 35 32'/><path d='M67 25C63 26 61 29 61 32'/><path d='M29 71C33 70 35 67 35 64'/><path d='M67 71C63 70 61 67 61 64'/></g></svg>");

<body>
<div id="netpill" role="status">Offline — everything but lookups still works</div>
<canvas id="sky"></canvas>
<button id="ribbon" aria-label="Back to the book you're reading"><i></i></button>
<div id="app"></div>
<nav id="nav"></nav>

<script>
'use strict';
/* ─────────────────────────────────────────────────────────────────
   LingoBox — keep the words a book gives you.
   Everything lives on this device.
──────────────────────────────────────────────────────────────────*/
const KEY='lingobox.v1', OLD_KEY='margin.v1', DAY=864e5, VER='3.0';

/* Genre worlds. The palette and the weather both come from here. */
const GENRES=[
  /* Pigments a colourman of 1791 could grind, not screen colours. These
     are what the spines, the jackets and the weather are painted with,
     and they match the [data-genre] blocks in the stylesheet exactly. */
  {id:'romance', name:'Romance',  fx:'petal', a:'#8d2340', b:'#a93c57', line:'Petals, and someone worth the trouble.'},
  {id:'fantasy', name:'Fantasy',  fx:'ember', a:'#4a2d6b', b:'#7a5518', line:'Embers rising off something old and magic.'},
  {id:'thriller',name:'Thriller', fx:'rain',  a:'#6f1b16', b:'#3c4450', line:'Rain on glass, and nobody telling the truth.'},
  {id:'literary',name:'Literary', fx:'dust',  a:'#6b541c', b:'#7d4a16', line:'Dust in a shaft of afternoon light.'},
  {id:'scifi',   name:'Sci-fi',   fx:'star',  a:'#17525f', b:'#2f3570', line:'Stars going past the window, slowly.'},
  {id:'nature',  name:'Nature',   fx:'leaf',  a:'#1f4d2e', b:'#45631c', line:'Leaves coming down, unhurried.'},
  {id:'horror',  name:'Horror',   fx:'fog',   a:'#34343a', b:'#6f1b16', line:'Fog that has been there a while.'},
  {id:'poetry',  name:'Poetry',   fx:'mote',  a:'#4c1c52', b:'#15544f', line:'Small bright things drifting upward.'}
];
const genreOf=id=>GENRES.find(g=>g.id===id)||GENRES[3];

let db=load(), view='home', openBook=null, bookTab='words', sess=null, draft=null;

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY));
    if(d&&d.books) return Object.assign({books:[],words:[],quotes:[],notes:[],log:{},profile:null,prefs:{}},d);
  }catch(e){}
  return {books:[],words:[],quotes:[],notes:[],log:{},profile:null,prefs:{}};
}
/* One row per local day: a = things kept, r = things reviewed. Feeds the
   heatmap and the recap. Old rows are never rewritten. */
const dayKey=t=>{const d=new Date(t??Date.now());
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function bumpLog(k,n){const key=dayKey(); const row=db.log[key]||(db.log[key]={a:0,r:0});
  row[k]=(row[k]||0)+(n||1);}/* callers save */
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ toast('Storage is full — download a backup now'); }
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const book=id=>db.books.find(b=>b.id===id);
const $=s=>document.querySelector(s);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function when(ts){const d=Math.floor((Date.now()-ts)/DAY);
  return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .3s'},1600);setTimeout(()=>t.remove(),1950);}
function toastAction(m,label,fn){const t=document.createElement('div');t.className='toast';
  t.innerHTML=esc(m); const b=document.createElement('button'); b.textContent=label;
  b.onclick=()=>{t.remove();fn()}; t.appendChild(b); document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .3s'},8000);setTimeout(()=>t.remove(),8400);}

/* ══ the weather ══════════════════════════════════════════════════
   A canvas behind the page. Each genre gets its own drift. Skipped
   entirely when the reader asks for reduced motion.
------------------------------------------------------------------*/
const sky=$('#sky'), ctx=sky.getContext('2d');
let parts=[], fxKind='dust', W=0, H=0, raf=0;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

function sizeSky(){const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;sky.width=W*d;sky.height=H*d;sky.style.width=W+'px';sky.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',()=>{sizeSky();seed(fxKind)});

const COUNT={petal:14,ember:18,rain:30,dust:14,star:30,leaf:11,fog:6,mote:13};
function seed(kind){
  fxKind=kind; parts=[];
  const n=calm?0:COUNT[kind]||18;
  for(let i=0;i<n;i++) parts.push(mk(kind,true));
}
function mk(k,init){
  const y=init?Math.random()*H:-30;
  switch(k){
    case 'petal': return {x:Math.random()*W,y,r:5+Math.random()*6,vy:.25+Math.random()*.45,vx:-.25+Math.random()*.5,a:Math.random()*6.3,va:(Math.random()-.5)*.05,o:.35+Math.random()*.35};
    case 'ember': return {x:Math.random()*W,y:init?Math.random()*H:H+20,r:1+Math.random()*2.2,vy:-(.25+Math.random()*.6),vx:-.2+Math.random()*.4,o:.3+Math.random()*.5,tw:Math.random()*6.3};
    case 'rain':  return {x:Math.random()*W,y,len:9+Math.random()*16,vy:5+Math.random()*5,vx:-.7,o:.16+Math.random()*.22};
    case 'dust':  return {x:Math.random()*W,y:init?Math.random()*H:Math.random()*H,r:.8+Math.random()*1.6,vy:-.06+Math.random()*.12,vx:.12+Math.random()*.25,o:.18+Math.random()*.3};
    case 'star':  return {x:Math.random()*W,y:init?Math.random()*H:Math.random()*H,r:.5+Math.random()*1.4,vy:0,vx:-(.08+Math.random()*.35),o:.25+Math.random()*.55,tw:Math.random()*6.3};
    case 'leaf':  return {x:Math.random()*W,y,r:6+Math.random()*7,vy:.3+Math.random()*.4,vx:-.3+Math.random()*.6,a:Math.random()*6.3,va:(Math.random()-.5)*.035,o:.3+Math.random()*.3};
    case 'fog':   return {x:Math.random()*W,y:Math.random()*H,r:70+Math.random()*120,vy:-.02+Math.random()*.04,vx:.08+Math.random()*.16,o:.05+Math.random()*.07};
    default:      return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:1+Math.random()*2,vy:-(.15+Math.random()*.35),vx:-.15+Math.random()*.3,o:.25+Math.random()*.4,tw:Math.random()*6.3};
  }
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888'}
let c1='#888',c2='#888';
function refreshColors(){c1=css('--g1');c2=css('--g2')}

/* A 1px hard-edged circle on white paper does not read as a mote of dust.
   It reads as dirt on the screen. Anything small and round gets a soft
   falloff and a wider radius instead, so it reads as something in the air
   rather than something on the glass. */
function blob(x,y,r,col,alpha){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(.45,col); g.addColorStop(1,'transparent');
  const a=ctx.globalAlpha; ctx.globalAlpha=a*alpha;
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.3); ctx.fill();
  ctx.globalAlpha=a;
}

function tick(t){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy;
    if(p.a!==undefined) p.a+=p.va;
    if(p.y>H+40||p.y<-60||p.x>W+80||p.x<-80){Object.assign(p,mk(fxKind,false));continue}
    ctx.save(); ctx.globalAlpha=p.o;
    switch(fxKind){
      case 'petal':
        ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=c2;
        ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,6.3);ctx.fill();break;
      case 'ember':
        ctx.globalAlpha=p.o*(.6+.4*Math.sin(t/380+p.tw));
        blob(p.x,p.y,p.r*2.6,c2,.8);break;
      case 'rain':
        ctx.strokeStyle=c2;ctx.lineWidth=1.1;ctx.beginPath();
        ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*2.2,p.y+p.len);ctx.stroke();break;
      case 'dust':
        blob(p.x,p.y,p.r*3,c1,.5);break;
      case 'star':
        ctx.globalAlpha=p.o*(.5+.5*Math.sin(t/700+p.tw));
        blob(p.x,p.y,p.r*3,c1,.65);break;
      case 'leaf':
        ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=c1;
        ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.42,0,0,6.3);ctx.fill();break;
      case 'fog':
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0,c1);g.addColorStop(1,'transparent');ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();break;
      default: /* motes */
        ctx.globalAlpha=p.o*(.55+.45*Math.sin(t/500+p.tw));
        blob(p.x,p.y,p.r*3,c2,.55);
    }
    ctx.restore();
  }
  raf=requestAnimationFrame(tick);
}
function applyWorld(){
  const b=openBook&&book(openBook);
  const id=draft||(b?b.genre:db.prefs.lastGenre)||'literary';
  document.documentElement.dataset.genre=id;
  refreshColors();
  const k=genreOf(id).fx;
  if(k!==fxKind||!parts.length) seed(k);
}

/* ══ spaced repetition (SM-2) ═════════════════════════════════════*/
const fresh=()=>({ease:2.5,reps:0,interval:0,due:Date.now()});
function grade(w,q){
  const c=w.srs||(w.srs=fresh());
  if(q<3){c.reps=0;c.interval=0;c.due=Date.now()+6e5;}
  else{c.reps++;c.interval=c.reps===1?1:c.reps===2?6:Math.round(c.interval*c.ease);
    c.ease=Math.max(1.3,c.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.due=Date.now()+c.interval*DAY;}
  bumpLog('r'); save();
}
const due=()=>db.words.filter(w=>(w.srs?.due??0)<=Date.now());
function nextIn(w,q){const c=w.srs||fresh();const r=c.reps+1;
  const i=r===1?1:r===2?6:Math.round(c.interval*c.ease*(q===5?1.3:1));
  return i===1?'tomorrow':i<31?i+' days':Math.round(i/30)+' months';}

/* ══ the cataloguer's hand ════════════════════════════════════════
   A library gives every volume a call number and every card a heading.
   These are derived, never stored, so an old shelf gets them for free.
------------------------------------------------------------------*/
const CLASS={literary:'823.91',romance:'823.92',fantasy:'823.87',thriller:'823.08',
  scifi:'823.0876',nature:'508.2',horror:'823.0873',poetry:'821.91'};
function surname(a){
  const parts=String(a||'').trim().split(/\s+/).filter(Boolean);
  const last=parts.length?parts[parts.length-1]:'';
  return (last.replace(/[^A-Za-z]/g,'').slice(0,3)||'ANO').toUpperCase();
}
const callNo=b=>`${CLASS[b.genre]||'823'} ${surname(b.author)}`;
/* Accession numbers run in the order volumes joined the shelf. */
function accession(b){
  const i=db.books.slice().sort((x,y)=>(x.at||0)-(y.at||0)).findIndex(x=>x.id===b.id);
  return 'A' + String(10237 + (i<0?0:i)*7).padStart(6,'0');
}

/* ══ how well a word is known ═════════════════════════════════════
   Read straight off the SM-2 schedule that already decides when a word
   returns, so a badge can never contradict the practice.
------------------------------------------------------------------*/
const LEVELS=[{id:'new',name:'New'},{id:'learn',name:'Learning'},{id:'known',name:'Known'},{id:'master',name:'Mastered'}];
function levelOf(w){
  const c=w.srs||{reps:0,interval:0};
  if((c.interval||0)>=21) return LEVELS[3];
  const r=c.reps||0;
  return r>=5?LEVELS[3]:r>=3?LEVELS[2]:r>=1?LEVELS[1]:LEVELS[0];
}
const countLevels=()=>db.words.reduce((a,w)=>{const k=levelOf(w).id;a[k]=(a[k]||0)+1;return a},{});
const mastered=()=>db.words.filter(w=>levelOf(w).id==='master').length;

/* A rank, so a growing collection feels like it is going somewhere. */
const RANKS=[{at:0,name:'Browsing'},{at:10,name:'Collector'},{at:25,name:'Reader'},
  {at:50,name:'Wordsmith'},{at:100,name:'Lexicographer'},{at:250,name:'Philologist'},
  {at:500,name:'Logophile'},{at:1000,name:'Living Dictionary'}];
function rank(){
  const n=db.words.length; let cur=RANKS[0], next=null;
  for(const r of RANKS){ if(n>=r.at) cur=r; else { next=r; break } }
  return {cur,next,n,to:next?next.at-n:0};
}

/* ══ how fast this book is going ══════════════════════════════════
   Every bookmark move is dated, so pages-per-day falls out of it —
   the one genuinely useful thing a Kindle knows that paper doesn't.
------------------------------------------------------------------*/
function pace(b){
  const m=(b.marks||[]).filter(x=>x&&x.at&&x.page>=0);
  if(m.length<2||!b.pages) return null;
  const a=m[0], z=m[m.length-1];
  const days=(z.at-a.at)/DAY, pages=z.page-a.page, left=b.pages-b.page;
  if(days<0.04||pages<=0||left<=0) return null;
  const d=left/(pages/days);
  return d<1?'finishing today':d<2?'about a day left':d<60?`about ${Math.round(d)} days left`:null;
}

/* ══ streak ══════════════════════════════════════════════════════*/
function touchStreak(){
  const p=db.profile; if(!p) return;
  const today=new Date().toDateString();
  if(p.lastDay===today) return;
  const y=new Date(Date.now()-DAY).toDateString();
  p.streak=(p.lastDay===y)?(p.streak||0)+1:1;
  p.lastDay=today; save();
}

/* ══ dictionary ═══════════════════════════════════════════════════*/
const SOURCES=[
  {name:'Free Dictionary',url:w=>'https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),parse:pFree},
  {name:'Wiktionary',url:w=>'https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(w),parse:pWik}
];
const fail=(code,m)=>Object.assign(new Error(m),{code});
function stripTags(h){const d=new DOMParser().parseFromString(String(h||''),'text/html');
  return (d.body.textContent||'').replace(/\s+/g,' ').trim();}
function pFree(j){const d=j[0],s=[];
  (d.meanings||[]).forEach(m=>(m.definitions||[]).slice(0,2).forEach(x=>
    s.push({pos:m.partOfSpeech||'',def:x.definition,ex:x.example||''})));
  return{phonetic:d.phonetic||(d.phonetics||[]).find(p=>p.text)?.text||'',
    audio:(d.phonetics||[]).find(p=>p.audio)?.audio||'',senses:s.slice(0,5),
    syn:[...new Set((d.meanings||[]).flatMap(m=>m.synonyms||[]))].slice(0,6)};}
// Wiktionary keys its answer by language. Reading only `en` threw away every
// other one — so a word like "pyar" came back as if it did not exist. English
// first, then whatever language actually has it.
const LANGS={en:'English',hi:'Hindi',ur:'Urdu',es:'Spanish',fr:'French',de:'German',it:'Italian',
  pt:'Portuguese',nl:'Dutch',ru:'Russian',ja:'Japanese',zh:'Chinese',ko:'Korean',ar:'Arabic',
  fa:'Persian',bn:'Bengali',ta:'Tamil',te:'Telugu',mr:'Marathi',gu:'Gujarati',pa:'Punjabi',
  la:'Latin',el:'Greek',tr:'Turkish',pl:'Polish',sv:'Swedish',he:'Hebrew'};
function pWik(j){
  const has=k=>(j[k]||[]).some(sec=>(sec.definitions||[]).length);
  const lang=has('en')?'en':Object.keys(j||{}).find(has);
  if(!lang) return{phonetic:'',audio:'',senses:[],syn:[],lang:''};
  const s=[];
  (j[lang]||[]).forEach(sec=>(sec.definitions||[]).slice(0,3).forEach(d=>{
    const t=stripTags(d.definition); if(!t) return;
    s.push({pos:(sec.partOfSpeech||'').toLowerCase(),def:t,
      ex:stripTags((d.parsedExamples||[])[0]?.example||(d.examples||[])[0]||'')});}));
  return{phonetic:'',audio:'',senses:s.slice(0,5),syn:[],lang};}

/* ── the dictionary that ships with the book ──────────────────────
   93,000 headwords living beside the page. No key, no network: it
   answers on a train, in a preview, anywhere. The online sources are
   still consulted after, because they bring pronunciation, examples,
   synonyms and the words a 1913 lexicon never met.
------------------------------------------------------------------*/
let LEX=null, lexState='idle';
async function loadLexicon(){
  if(LEX) return LEX;
  if(lexState==='failed') return null;
  try{
    const r=await fetch('lexicon.json');
    if(!r.ok) throw 0;
    LEX=await r.json(); lexState='ready'; return LEX;
  }catch(e){ lexState='failed'; return null; }
}
// readers meet words inflected; the lexicon keeps headwords
function stems(w){
  const o=[w], add=x=>{ if(x&&x.length>2&&o.indexOf(x)<0) o.push(x) };
  if(w.endsWith('ies')) add(w.slice(0,-3)+'y');
  if(w.endsWith('es')) add(w.slice(0,-2));
  if(w.endsWith('s')) add(w.slice(0,-1));
  if(w.endsWith('ed')){ add(w.slice(0,-2)); add(w.slice(0,-1)); add(w.slice(0,-3)+'e'); }
  if(w.endsWith('ing')){ add(w.slice(0,-3)); add(w.slice(0,-3)+'e'); }
  if(w.endsWith('ly')) add(w.slice(0,-2));
  if(w.endsWith('est')) add(w.slice(0,-3));
  if(w.endsWith('er')) add(w.slice(0,-2));
  return o;
}
async function localLookup(term){
  const lex=await loadLexicon(); if(!lex) return null;
  const w=term.trim().toLowerCase();
  for(const c of stems(w)) if(lex[c]) return {
    phonetic:'',audio:'',syn:[],lang:'en',
    senses:[{pos:'',def:lex[c],ex:''}],
    source:'LingoBox dictionary'+(c!==w?' · '+c:'')
  };
  return null;
}

async function lookup(term){
  const w=term.trim().toLowerCase(); let reachable=false;
  for(const s of SOURCES){
    let r; try{r=await fetch(s.url(w))}catch(e){continue}
    reachable=true;
    if(r.status===404||!r.ok) continue;
    try{
      const p=s.parse(await r.json());
      if(p.senses.length){
        const tag=p.lang&&p.lang!=='en' ? s.name+' · '+(LANGS[p.lang]||p.lang.toUpperCase()) : s.name;
        return Object.assign(p,{source:tag});
      }
    }catch(e){}
  }
  throw reachable?fail('none','no entry'):fail('unreachable','nothing reachable');
}

/* Hearing a word said by actual people, and seeing it used. */
const hearLinks=w=>`<div class="hear">
  <a href="https://youglish.com/pronounce/${encodeURIComponent(w)}/english" target="_blank" rel="noopener">▸ Real speakers ↗</a>
  <a href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(w)}" target="_blank" rel="noopener">Cambridge ↗</a>
  <a href="https://forvo.com/word/${encodeURIComponent(w)}/#en" target="_blank" rel="noopener">Forvo ↗</a>
  <a href="https://www.google.com/search?q=${encodeURIComponent(w+' meaning')}" target="_blank" rel="noopener">Search the web ↗</a></div>`;

async function doLookup(){
  const term=($('#w')?.value||'').trim(), box=$('#lk');
  if(!term||!box) return;
  box.innerHTML=`<div class="lkh"><span class="lbl">Looking up ${esc(term)}…</span></div>`;
  // Answer from the shelf copy first, so there is never a wait or a blank.
  const near=await localLookup(term);
  if(near) paintLookup(term,near);
  try{
    const r=await lookup(term);
    // Online only replaces it when it genuinely brings more.
    const best=(!near||r.senses.length>1||r.phonetic||r.syn.length)?r:near;
    paintLookup(term,best);
  }catch(e){
    if(near) return;   // already answered; nothing failed as far as the reader is concerned
    // The browser knows whether it has a connection. If it does and the request
    // still never left, the page is blocking it — say that, rather than making
    // someone go and check their wifi.
    const offline = ('onLine' in navigator) && navigator.onLine === false;
    const head = e.code==='none' ? `No entry for “${esc(term)}”`
               : offline         ? 'You’re offline'
                                 : 'This page blocked the lookup';
    const why  = e.code==='none' ? 'Both dictionaries are word-by-word references, strongest in English. If it is from another language, a name, or very new, the links below will find it — then write the meaning in your own words.'
               : offline         ? 'Your device says it has no connection. Try again once you’re back online — or write the meaning yourself, which works either way.'
                                 : 'Your connection is fine. Previews like this one refuse outside requests, so the dictionary can’t be reached from here. Open LingoBox from its own address and Look up works. You can still write the meaning yourself below.';
    box.innerHTML=`<div class="lkh" style="display:block">
      <span class="lbl">${head}</span>
      <div style="font-size:13.5px;line-height:1.5;margin-top:5px;color:var(--ink2)">${why}</div>
      ${hearLinks(term)}</div>`;
  }
}
function paintLookup(term,r){
  const box=$('#lk'); if(!box) return;
  window.__senses=r.senses;
  box.innerHTML=`<div class="lkh"><span class="word" style="font-size:17px">${esc(term)}</span>
    ${r.phonetic?`<span class="pron">${esc(r.phonetic)}</span>`:''}
    <button class="say" data-say="${esc(term)}" data-audio="${esc(r.audio||'')}" aria-label="Hear ${esc(term)}">▸</button>
    <span class="lbl" style="margin-left:auto">${esc(r.source)}</span></div>`
    +(r.senses.map((s,i)=>`<button type="button" class="sense" onclick="useSense(${i})">
      ${s.pos?`<span class="pos">${esc(s.pos)}</span>`:''}<p>${esc(s.def)}</p>
      ${s.ex?`<em>"${esc(s.ex)}"</em>`:''}</button>`).join(''))
    +(r.syn.length?`<div class="syn">${r.syn.map(s=>`<span class="chip flat">${esc(s)}</span>`).join('')}</div>`:'')
    +`<div style="padding:10px 13px;border-top:1px solid var(--line2)">${hearLinks(term)}</div>`;
  if($('#ph')) $('#ph').value=r.phonetic||'';
  if($('#au')) $('#au').value=r.audio||'';
}
function useSense(i){
  const s=(window.__senses||[])[i]; if(!s) return;
  $('#m').value=(s.pos?s.pos+' — ':'')+s.def;
  if(s.ex&&!$('#c').value.trim()) $('#c').value=s.ex;
  toast('Kept — now put it in your words'); $('#mine')?.focus();
}

/* ══ finding a book ═══════════════════════════════════════════════
   Open Library is free, needs no key, and answers browsers directly.
   One search fills in the author, the length and the cover.
------------------------------------------------------------------*/
const coverUrl=(id,size)=>`https://covers.openlibrary.org/b/id/${id}-${size||'M'}.jpg`;

  if(!q||!box) return;
  box.innerHTML=`<div class="lkh" style="border-radius:var(--r2)"><span class="lbl">Searching…</span></div>`;

      <button type="button" class="sense" style="display:flex;gap:11px;align-items:center" onclick="useBook(${i})">

                   :`<span class="cov sm ph"></span>`}
        <span style="flex:1;min-width:0"><span style="font-weight:700;font-size:14.5px">${esc(d.title||'')}</span>
        <span class="dim" style="display:block;margin-top:2px">${esc((d.author_name||[])[0]||'—')}${d.first_publish_year?' · '+d.first_publish_year:''}${d.number_of_pages_median?' · '+d.number_of_pages_median+'pp':''}</span></span>
      </button>`).join('')}</div>`;
  }catch(e){
    box.innerHTML=`<div class="lkh" style="border-radius:var(--r2);display:block">
      <span class="lbl">${navigator.onLine===false?'You’re offline':'This page blocked the search'}</span>
      <div style="font-size:13px;margin-top:4px;color:var(--ink2)">Type the details in yourself — it all works the same.</div></div>`;

function useBook(i){
  const d=(window.__found||[])[i]; if(!d) return;
  $('#t').value=d.title||''; $('#a').value=(d.author_name||[])[0]||'';
  if(d.number_of_pages_median&&!$('#tp').value) $('#tp').value=d.number_of_pages_median;

  $('#fb').innerHTML=`<div class="lkh" style="border-radius:var(--r2);display:flex;gap:10px;align-items:center">
    ${draftCover?`<img src="${draftCover}" alt="" class="cov sm" onerror="this.style.visibility='hidden'">`:''}
    <span class="lbl">Filled in — change anything you like</span></div>`;

}

/* ══ keeping the data ═════════════════════════════════════════════
   Ask the browser to treat this as worth keeping, so it is not the
   first thing evicted when the device runs short.
------------------------------------------------------------------*/
async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return;
    if(navigator.storage.persisted && await navigator.storage.persisted()){db.prefs.persisted=true;save();return}
    db.prefs.persisted=await navigator.storage.persist(); save();
  }catch(e){}
}

/* ══ saying it ════════════════════════════════════════════════════*/
function say(word,url){
  if(!word) return;
  if(url){const a=new Audio(url);a.play().then(()=>{}).catch(()=>speak(word));return}
  speak(word);
}
function speak(w){
  if(!('speechSynthesis' in window)) return toast('No voice on this device');
  const u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const sayBtn=(w,a)=>`<button class="say" data-say="${esc(w)}" data-audio="${esc(a||'')}" aria-label="Hear ${esc(w)}">▸</button>`;

/* ══ listening ════════════════════════════════════════════════════
   The browser can hear. Say the word and it checks you — no network,
   no key, and nothing recorded anywhere.
------------------------------------------------------------------*/
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canListen=!!SR;
const flat=t=>String(t||'').toLowerCase().replace(/[^a-z]/g,'');

function listen(){
  if(!SR) return toast('This browser can’t listen');
  const w=sess.queue[0];
  let rec;
  try{ rec=new SR(); }catch(e){ return toast('This browser can’t listen') }
  rec.lang='en-GB'; rec.interimResults=false; rec.maxAlternatives=5;
  sess.listening=true; sess.heard=''; sess.micErr=''; render();
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>String(a.transcript||'').trim());
    const hit=alts.some(a=>flat(a)===flat(w.word));
    sess.heard=alts[0]||''; sess.listening=false; sess.picked=hit?'ok':'no';
    grade(w,hit?4:0); if(hit) sess.done++;
    render();
  };
  rec.onerror=e=>{
    sess.listening=false;
    sess.micErr = e.error==='not-allowed' ? 'Microphone permission was refused.'
                : e.error==='no-speech'   ? 'Didn’t catch anything — try again.'
                : 'The microphone isn’t available here.';
    render();
  };
  rec.onend=()=>{ if(sess&&sess.listening){sess.listening=false;render()} };
  try{ rec.start(); }catch(e){ sess.listening=false; sess.micErr='Could not start listening.'; render(); }
}

/* ══ a quote worth sharing ════════════════════════════════════════
   Drawn on a canvas in the book's own colours. Nothing is uploaded —
   the image is made here and handed to the share sheet.
------------------------------------------------------------------*/
function wrapText(x,text,maxW,size){
  x.font=`600 ${size}px Georgia, 'Iowan Old Style', serif`;
  const words=String(text).split(/\s+/), lines=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(x.measureText(t).width>maxW&&line){lines.push(line);line=w} else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
async function shareQuote(id){
  const q=db.quotes.find(x=>x.id===id); if(!q) return;
  const b=book(q.bookId), g=genreOf(b&&b.genre);
  const S=1080, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  const grad=x.createLinearGradient(0,0,S,S);
  grad.addColorStop(0,g.a); grad.addColorStop(1,g.b);
  x.fillStyle=grad; x.fillRect(0,0,S,S);
  x.fillStyle='rgba(255,255,255,.10)';
  for(let i=0;i<40;i++){const r=6+Math.random()*26;
    x.beginPath();x.arc(Math.random()*S,Math.random()*S,r,0,6.3);x.fill();}
  // a big soft quotation mark, the way a pull-quote is set
  x.save(); x.globalAlpha=.22; x.fillStyle='#fff';
  x.font="700 260px Georgia, 'Iowan Old Style', serif";
  x.fillText('\u201C',60,300); x.restore();
  x.fillStyle='#fff';
  let size=64;
  let lines=wrapText(x,q.text,S-190,size);
  while(lines.length>9&&size>34){size-=4;lines=wrapText(x,q.text,S-190,size);}
  x.font=`600 ${size}px Georgia, 'Iowan Old Style', serif`;
  const lh=size*1.38, top=(S-lines.length*lh)/2 - 30;
  lines.forEach((l,i)=>x.fillText(l,95,top+i*lh+size));
  x.globalAlpha=.9; x.font='500 30px -apple-system, Helvetica, Arial, sans-serif';
  const who=(b?b.title:'')+(b&&b.author?' · '+b.author:'')+(q.page?' · p.'+q.page:'');
  x.fillText(who.slice(0,64),95,S-140);
  x.globalAlpha=.78; x.font='800 27px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText('LingoBox',95,S-86);
  c.toBlob(async blob=>{
    if(!blob) return toast('Could not make the image');
    const file=new File([blob],`lingobox-quote-${stamp()}.png`,{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file]}); return;
      }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    if(window.claude?.downloads?.save){
      try{ await window.claude.downloads.save({filename:file.name,data:blob}); toast('Saved'); }
      catch(e){ if(e&&e.code!=='declined') toast('Could not save here'); }
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{href:url,download:file.name});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Image saved');
  },'image/png');
}

/* ══ the fingerprint ═══════════════════════════════════════════════
   Every book earns a constellation: one star per word, placed by the
   word itself (not by chance), grown brighter as the word settles into
   memory. Two people reading the same book still build different skies.
------------------------------------------------------------------*/
function hash32(s){let h=2166136261>>>0;s=String(s).toLowerCase();
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const frac=h=>((h>>>10)%1000)/1000;

function dnaPoints(b){
  return db.words.filter(w=>w.bookId===b.id).map(w=>{
    const h1=hash32(w.word+'·'+b.id), h2=hash32(b.id+'·'+w.word);
    const iv=Math.min(60,Math.max(0,w.srs?w.srs.interval:0));
    return {x:7+frac(h1)*86, y:9+frac(h2)*82, r:1.5+(iv/60)*3.2, tw:h2%628};
  });
}
function dnaSvg(b){
  const pts=dnaPoints(b), id='dg'+b.id;
  const rng=mulberry32(hash32(b.id));
  const bg=[...Array(12)].map(()=>({x:rng()*100,y:rng()*100,r:.4+rng()*.8,o:.2+rng()*.45}));
  let lines='';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<24) lines+=`<line x1="${pts[i].x.toFixed(1)}" y1="${pts[i].y.toFixed(1)}"
      x2="${pts[j].x.toFixed(1)}" y2="${pts[j].y.toFixed(1)}" stroke="url(#l${id})"
      stroke-width="${(0.9*(1-d/24)).toFixed(2)}" opacity="${(0.55*(1-d/24)).toFixed(2)}"/>`;
  }
  const stars=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(2)}" fill="url(#p${id})"/>`).join('');
  const sparks=bg.map(s=>`<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r.toFixed(2)}" fill="var(--g2)" opacity="${s.o.toFixed(2)}"/>`).join('');
  /* an empty book still gets a sky — three faint stars, waiting */
  const waiting=!pts.length?`<circle cx="34" cy="42" r="1.1" fill="var(--g1)" opacity=".3"/>
    <circle cx="62" cy="28" r="1.4" fill="var(--g2)" opacity=".35"/>
    <circle cx="55" cy="66" r="1" fill="var(--g1)" opacity=".25"/>`:'';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="This book's fingerprint">
    <defs>
      <radialGradient id="p${id}"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></radialGradient>
      <linearGradient id="l${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></linearGradient>
    </defs>${sparks}${lines}${stars}${waiting}</svg>`;
}
async function shareDna(id){
  const b=book(id); if(!b) return;
  const g=genreOf(b.genre), pts=dnaPoints(b), rng=mulberry32(hash32(b.id));
  const S=1080, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  const grad=x.createLinearGradient(0,0,S,S); grad.addColorStop(0,g.a); grad.addColorStop(1,g.b);
  x.fillStyle=grad; x.fillRect(0,0,S,S);
  x.fillStyle='rgba(255,255,255,.08)';
  for(let i=0;i<42;i++){x.beginPath();x.arc(rng()*S,rng()*S,6+rng()*26,0,6.3);x.fill()}
  const M=170, span=S-M*2, P=pts.map(p=>({x:M+p.x/100*span, y:M+p.y/100*span, r:4+p.r*2.4}));
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
    if(d<span*.24){x.strokeStyle='rgba(255,255,255,'+(0.5*(1-d/(span*.24))).toFixed(2)+')';
      x.lineWidth=1.4*(1-d/(span*.24));x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}
  }
  P.forEach(p=>{x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.fillStyle='#fff'; x.globalAlpha=.92; x.font='600 46px Georgia, "Iowan Old Style", serif';
  x.fillText(b.title.length>34?b.title.slice(0,33)+'…':b.title, M, S-168);
  x.globalAlpha=.75; x.font='500 30px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText((b.author?b.author+' · ':'')+pts.length+' word'+(pts.length===1?'':'s')+' kept', M, S-120);
  x.globalAlpha=.8; x.font='800 27px -apple-system, Helvetica, Arial, sans-serif';
  x.fillText('LingoBox', M, S-62);
  c.toBlob(async blob=>{
    if(!blob) return toast('Could not make the image');
    const file=new File([blob],`lingobox-fingerprint-${stamp()}.png`,{type:'image/png'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return} }
    catch(e){ if(e&&e.name==='AbortError') return; }
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{href:url,download:file.name});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Image saved');
  },'image/png');
}

/* ══ what the shelf remembers ═════════════════════════════════════
   A word of the day chosen from your own books — not the internet's —
   and things kept on this day in past weeks, resurfaced before they
   sink for good.
------------------------------------------------------------------*/
function wotd(){
  if(db.words.length<2) return '';
  const w=db.words[hash32(dayKey())%db.words.length];
  const b=book(w.bookId);
  return `<div class="card daycard" role="button" tabindex="0" data-book="${w.bookId}">
    <div class="lbl">Word of the day · from your own shelf</div>
    <div class="row" style="margin-top:8px;align-items:baseline">
      <span class="big">${esc(w.word)}</span>
      ${w.phonetic?`<span class="pron">${esc(w.phonetic)}</span>`:''}
      <span style="margin-left:auto">${sayBtn(w.word,w.audio)}</span>
    </div>

    ${b?`<div class="dim" style="margin-top:7px">${esc(b.title)}${w.page?' · p.'+w.page:''}</div>`:''}
  </div>`;
