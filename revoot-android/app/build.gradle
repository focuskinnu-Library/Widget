plugins {
    id 'com.android.application'
}

// ── The only lines you normally touch ────────────────────────────
def appId       = 'in.revoot.app'      // PERMANENT once uploaded to Play
def versionNm   = '1.0.0'
// versionCode comes from CI (one higher on every build); 1 locally.
def versionCd   = (System.getenv('VERSION_CODE') ?: '1') as int
// ────────────────────────────────────────────────────────────────

android {
    namespace appId
    compileSdk 36

    defaultConfig {
        applicationId appId
        minSdk 26
        targetSdk 36
        versionCode versionCd
        versionName versionNm
    }

    signingConfigs {
        release {
            // Supplied by CI from repository secrets. Never commit a keystore.
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
